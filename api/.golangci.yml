version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - staticcheck
    - revive
    - misspell
    - unconvert
    - prealloc
    - copyloopvar

  settings:
    revive:
      rules:
        - name: exported
          disabled: true

  exclusions:
    paths:
      - ".*_gen\\.go$"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
