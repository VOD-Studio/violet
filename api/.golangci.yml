version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - revive
    - misspell
    - unconvert
    - prealloc
    - copyloopvar
    - gosec

  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
        - (*database/sql.DB).Close
        - (net/http.ResponseWriter).Write
        - fmt.Fprintf
        - fmt.Printf
        - fmt.Println
        - fmt.Print
        - os.Stdout.Write
    revive:
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G104

  exclusions:
    paths:
      - internal/repository/generated
      - internal/app/wire_gen.go$
      - ".*_gen\\.go$"
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      - path: cmd/server/main\.go
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false
