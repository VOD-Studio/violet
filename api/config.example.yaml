# 博客项目配置文件模板
#
# 使用说明：
#   1. 此文件提供默认配置，通常不需要修改
#   2. 敏感配置（密码、API Key）通过环境变量覆盖
#   3. 本地开发：复制 .env.example 为 .env 并修改
#   4. 生产部署：使用 .env.production 配置环境变量
#
# 配置优先级：环境变量 > config.yaml > 此文件的默认值

# ── 运行环境 ────────────────────────────────
environment: development

# ── 服务配置 ────────────────────────────────
port: 9090
frontend_url: http://localhost:5173
upload_path_prefix: /uploads/

# ── 数据库 ──────────────────────────────────
database:
  host: localhost
  port: 5432
  name: blog
  user: blog
  password: "" # 通过 DATABASE_PASSWORD 环境变量配置
  sslmode: disable # 生产环境通过 DATABASE_SSLMODE=require 覆盖

# ── Redis ───────────────────────────────────
redis:
  host: localhost
  port: 6379
  db: 0
  password: "" # 通过 REDIS_PASSWORD 环境变量配置（可选）

# ── Google OAuth ─────────────────────────────
google_client_id: "" # 通过 GOOGLE_CLIENT_ID 环境变量配置

# ── 鉴权 Cookie ─────────────────────────────
# opaque session id 通过 HttpOnly Cookie 下发；CSRF 通过 double-submit cookie 防护
# 生产部署建议通过环境变量覆盖：COOKIE_DOMAIN、COOKIE_SECURE=true、COOKIE_SAMESITE
cookie:
  domain: ""
  secure: false
  samesite: lax
  csrf_name: violet_csrf
  session_name: violet_session

# ── Session 生命周期 ─────────────────────────────
# idle_ttl 滑动续期窗口（活跃用户不过期）；max_ttl 绝对寿命上限（<=0 无上限）
session:
  idle_ttl: 168h
  max_ttl: 0s

# ── CORS 允许来源 ─────────────────────────────
# 生产环境通过 CORS_ALLOWED_ORIGINS=a,b 配置（逗号分隔）
cors_allowed_origins:
  - http://localhost:3000
  - http://localhost:5173

# ── 受信代理 ─────────────────────────────────
# 生产环境通过 TRUSTED_PROXIES=a,b 配置（逗号分隔，填 Nginx/CDN 出口 CIDR）
# 留空时一律使用 TCP 连接对端地址作为客户端 IP，忽略 X-Forwarded-For（防欺骗）
trusted_proxies: []


# ── 邮件服务 (Resend) ────────────────────────
resend_api_key: "" # 通过 RESEND_API_KEY 环境变量配置
email_from: noreply@yourdomain.com

# ── B站表情种子数据 ──────────────────────────
# 通过环境变量配置：BILIBILI_COOKIES（完整 cookie 字符串）
bilibili_api_type: "user" # user(用户收藏) 或 official(官方)
bilibili_cookies: ""

# ── 超级管理员 ────────────────────────────────
superadmin:
  enabled: false
  username: admin
  email: admin@example.com
  password: "" # 通过 SUPERADMIN_PASSWORD 环境变量配置

# ── 代码运行器（可运行代码块沙箱执行）──────────────
# 需 api 容器挂载 docker.sock（生产 podman 见 docs/deploy/manual-deploy.md）
# 架构决策见 docs/adr/0006-code-runner-architecture.md
code_runner:
  enabled: true # 默认启用（本地开发友好）；生产未挂 docker.sock 时自动降级
  max_cpu_cores: 2.0        # 单次执行 CPU 上限（核数）
  max_memory_mb: 1024       # 单次执行内存上限（MB）
  max_timeout_secs: 30      # 单次执行墙上时间上限（秒）
  max_output_bytes: 1048576 # stdout+stderr 输出上限（字节，默认 1MB）
  max_source_bytes: 65536   # 提交源码大小上限（字节，默认 64KB）
  allow_network: false      # 全局网络开关（需作者声明+语言允许+此开关三者为真）
  max_concurrent: 4         # 同时在跑的容器数上限
  queue_timeout_secs: 30    # 排队等容器槽超时（秒）
  task_ttl_secs: 300        # 完成任务 Redis 保留时长（秒）
  docker_socket_path: /var/run/docker.sock # podman 改 /run/podman/podman.sock
  languages: []             # 语言白名单，空=全部；收窄填 canonical key（python/node/go/rust/bun）
