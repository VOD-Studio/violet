# 博客项目配置文件模板
#
# 使用说明：
#   1. 此文件提供默认配置，通常不需要修改
#   2. 敏感配置（密码、API Key）通过环境变量覆盖
#   3. 本地开发：复制 .env.example 为 .env 并修改
#   4. 生产部署：使用 .env.production 配置环境变量
#
# 配置优先级：环境变量 > config.yaml > 此文件的默认值

# ── 运行环境 ────────────────────────────────
environment: development

# ── 服务配置 ────────────────────────────────
port: 9090
frontend_url: http://localhost:5173
upload_path_prefix: /uploads/

# ── 数据库 ──────────────────────────────────
database:
  host: localhost
  port: 5432
  name: blog
  user: blog
  password: "" # 通过 DATABASE_PASSWORD 环境变量配置
  sslmode: disable # 生产环境通过 DATABASE_SSLMODE=require 覆盖

# ── Redis ───────────────────────────────────
redis:
  host: localhost
  port: 6379
  db: 0
  password: "" # 通过 REDIS_PASSWORD 环境变量配置（可选）

# ── JWT ─────────────────────────────────────
jwt_private_key_path: ./jwt_private_key.pem
jwt_public_key_path: ./jwt_public_key.pem
jwt_access_token_ttl: 15m
jwt_refresh_token_ttl: 168h
# 允许未配置密钥文件时生成临时密钥（仅开发；生产必须 false，否则启动拒绝）
jwt_allow_ephemeral_key: false

# ── Google OAuth ─────────────────────────────
google_client_id: "" # 通过 GOOGLE_CLIENT_ID 环境变量配置

# ── 鉴权 Cookie ─────────────────────────────
# access/refresh token 通过 HttpOnly Cookie 下发；CSRF 通过 double-submit cookie 防护
# 生产部署建议通过环境变量覆盖：COOKIE_DOMAIN、COOKIE_SECURE=true、COOKIE_SAMESITE
cookie:
  domain: ""
  secure: false
  samesite: lax
  access_name: mimo_access
  refresh_name: mimo_refresh
  csrf_name: mimo_csrf

# ── CORS 允许来源 ─────────────────────────────
# 生产环境通过 CORS_ALLOWED_ORIGINS=a,b 配置（逗号分隔）
cors_allowed_origins:
  - http://localhost:3000
  - http://localhost:5173

# ── 受信代理 ─────────────────────────────────
# 生产环境通过 TRUSTED_PROXIES=a,b 配置（逗号分隔，填 Nginx/CDN 出口 CIDR）
# 留空时一律使用 TCP 连接对端地址作为客户端 IP，忽略 X-Forwarded-For（防欺骗）
trusted_proxies: []


# ── 邮件服务 (Resend) ────────────────────────
resend_api_key: "" # 通过 RESEND_API_KEY 环境变量配置
email_from: noreply@yourdomain.com

# ── B站表情种子数据 ──────────────────────────
# 通过环境变量配置：BILIBILI_SESSDATA, BILIBILI_BILI_JCT, BILIBILI_DEDEUSERID
bilibili_api_type: "user" # user(用户收藏) 或 official(官方)
bilibili_sessdata: ""
bilibili_bili_jct: ""
bilibili_dedeuserid: ""

# ── 超级管理员 ────────────────────────────────
superadmin:
  enabled: false
  username: admin
  email: admin@example.com
  password: "" # 通过 SUPERADMIN_PASSWORD 环境变量配置
