# CI 流水线
#
# PR 和 push 到 main / release/2.0 时触发，并行跑后端与前端检查。
# 后端: go vet + go test + golangci-lint + build + Docker 镜像构建验证
# 前端: biome check + tsc + vitest + build
#
# 任一 job 失败则 PR 检查失败，阻止合并。

name: CI

on:
  push:
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]

# 同一 PR 多次 push 时取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 后端检查（Go）
  # ============================================================
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./internal/domain/... ./internal/application/... ./internal/infrastructure/... -v -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api
          args: --timeout 5m

      - name: Docker 镜像构建验证
        run: docker build -t blog-api:ci .

  # ============================================================
  # 前端检查（TypeScript）
  # ============================================================
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build
