name: CI

on:
  push:
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: 精确验证的提交 SHA
        required: true
        type: string
      full:
        description: 强制执行双侧与基础设施检查
        type: boolean
        default: true
      build_images:
        description: 是否额外验证 Docker 镜像构建
        type: boolean
        default: false
      require_self_hosted:
        description: 强制自托管验收，禁止回退官方 runner
        type: boolean
        default: false

# PR 按影响范围验收；主干按精确提交全量验收并产出部署凭据。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.ref }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================
  # 变更侧检测：无关重任务在 job 级跳过，最终门禁核对实际执行结果
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.scope.outputs.full == 'true' && 'true' || steps.filter.outputs.api }}
      web: ${{ steps.scope.outputs.full == 'true' && 'true' || steps.filter.outputs.web }}
      web_image: ${{ (inputs.build_images || (!inputs.ref && (steps.scope.outputs.full == 'true' || steps.filter.outputs.web_image == 'true'))) && 'true' || 'false' }}
      infrastructure: ${{ steps.scope.outputs.full == 'true' && 'true' || steps.filter.outputs.infrastructure }}
      full: ${{ steps.scope.outputs.full }}
      base: ${{ steps.scope.outputs.base }}
      version: ${{ steps.scope.outputs.version }}
      publish_images: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/release/2.0' && !inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # paths-filter 对比需要历史；只拉 commit/tree，blob 按需
          fetch-depth: 0
          filter: blob:none

      - name: Resolve validation scope
        id: scope
        env:
          FULL: ${{ (github.event_name != 'pull_request' || inputs.full) && 'true' || 'false' }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          if [ "$FULL" = false ]; then
            echo "base=$(git merge-base "$BASE_SHA" HEAD)" >> "$GITHUB_OUTPUT"
          fi
          python3 - <<'PY'
          import json, os
          with open(".release-please-manifest.json") as source:
              version = json.load(source)["."]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version=v{version}\n")
          PY

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: steps.scope.outputs.full != 'true'
        id: filter
        with:
          initial-fetch-depth: '20'
          # 保留正向规则的 OR，同时让排除项生效；默认 some 会把否定模式也作为 OR。
          predicate-quantifier: some-with-excludes
          filters: |
            'api':
              - 'api/**'
              - '!api/README.md'
              - '.github/workflows/ci.yml'
              - 'scripts/check-ci-results.py'
              - 'scripts/tests/test_ci_results.py'
              - 'scripts/check-job-group.py'
              - 'scripts/tests/test_job_group.py'
              - 'scripts/ci-go-tests.py'
              - 'scripts/tests/test_ci_go_tests.py'
            'web':
              - 'web/**'
              - '!web/README.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-npm.yml'
              - '.github/actions/setup-web/**'
              - 'scripts/check-ci-results.py'
              - 'scripts/tests/test_ci_results.py'
              - 'scripts/check-job-group.py'
              - 'scripts/tests/test_job_group.py'
              - 'scripts/check-web-results.py'
              - 'scripts/tests/test_web_results.py'
              - 'api/internal/interfaces/http/**'
              - 'api/internal/openapi/**'
            # 镜像校验只覆盖 Dockerfile、依赖与锁文件漂移；源码构建由契约任务验证。
            'web_image':
              - 'web/Dockerfile'
              - 'web/.dockerignore'
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - 'web/pnpm-workspace.yaml'
              - 'web/server.mjs'
              - 'web/packages/*/package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-web/**'
            'infrastructure':
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'web/scripts/ci-*'
              - 'web/e2e/ci-test-map.json'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'Makefile'
              - 'release-please-config.json'
              - '.release-please-manifest.json'

  # 优先使用自托管 runner 216，不可用时退回官方 runner（见 pick-runner.yml）。
  runner:
    name: Pick runner
    uses: ./.github/workflows/pick-runner.yml
    with:
      require_self_hosted: ${{ inputs.require_self_hosted || false }}
    secrets: inherit

  # ============================================================
  # 后端检查（Go）
  # 静态检查、数据库测试与镜像校验互不依赖，并行执行；backend 汇总它们，保持既有 required check 名称。
  # ============================================================
  backend-lint:
    name: Backend lint
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      # govet 已在 .golangci.yml 启用并覆盖测试文件,不再单独跑 go vet。
      # 不用 action 的结果缓存:仅约 1MB 且恢复后仍需近 100 秒;go.sum 变化的 PR 会写出 PR 级缓存,
      # 之后同一份代码出现 staticcheck SA5011 误报(t.Fatal 后的空指针),删除缓存即恢复。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: api
          args: --timeout 5m
          skip-cache: true

  backend-build:
    name: Backend build
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Go build
        run: go build ./...

  backend-test:
    name: Backend tests
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    env:
      APK_MIRROR: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 'mirrors.aliyun.com' || 'dl-cdn.alpinelinux.org' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: violet_ci
          POSTGRES_PASSWORD: violet_ci
          POSTGRES_DB: violet_test
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1073741824
          --health-cmd "pg_isready -U violet_ci -d violet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Plan affected Go tests
        env:
          FULL: ${{ needs.changes.outputs.full }}
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          args=(--output "$RUNNER_TEMP/go-test-plan.json")
          if [ "$FULL" = true ]; then args+=(--full); else args+=(--base "$BASE_SHA"); fi
          python3 ../scripts/ci-go-tests.py "${args[@]}"

      - name: Prepare production WebP encoder
        run: |
          encoder_image="violet-webp-encoder:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --build-arg APK_MIRROR --target webp-builder --tag "$encoder_image" .
          encoder_container="$(docker create "$encoder_image" /bin/true)"
          trap 'docker rm -f "$encoder_container"; docker image rm "$encoder_image"' EXIT
          encoder_directory="$RUNNER_TEMP/violet-webp"
          mkdir -p "$encoder_directory"
          docker cp "${encoder_container}:/cwebp" "$encoder_directory/cwebp"
          chmod +x "$encoder_directory/cwebp"
          "$encoder_directory/cwebp" -version
          echo "$encoder_directory" >> "$GITHUB_PATH"

      - name: Go tests
        env:
          BLOG_TEST_PG_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
          MIGRATE_TEST_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
          CHAT_APPEARANCE_TEST_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          plan = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "go-test-plan.json").read_text())
          for field, flags in (("packages", []), ("integration_packages", ["-tags=integration"])):
              packages = plan[field]
              if packages:
                  subprocess.run(["go", "test", *flags, *packages, "-v", "-count=1"], check=True)
              else:
                  print(f"{field}: no affected packages")
          PY

  backend-image:
    name: Backend image
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true' && (!inputs.ref || inputs.build_images)
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    permissions:
      actions: write   # buildx type=gha 缓存读写;workflow 级仅 contents:read 会把 actions 收为 none
      contents: read
      packages: write
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    env:
      APK_MIRROR: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 'mirrors.aliyun.com' || 'dl-cdn.alpinelinux.org' }}
      GOPROXY: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 'https://goproxy.cn,direct' || 'https://proxy.golang.org,direct' }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.changes.outputs.publish_images == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker 镜像构建验证
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: ./api
          push: ${{ needs.changes.outputs.publish_images == 'true' }}
          tags: ghcr.io/vod-studio/violet-api:sha-${{ inputs.ref || github.sha }}
          build-args: |
            API_VERSION=${{ needs.changes.outputs.version }}
            APK_MIRROR=${{ env.APK_MIRROR }}
            GOPROXY=${{ env.GOPROXY }}
          cache-from: type=gha,scope=violet-api
          cache-to: ${{ needs.changes.outputs.publish_images == 'true' && 'type=gha,mode=max,scope=violet-api' || '' }}

  backend:
    name: Backend (Go)
    needs: [changes, backend-lint, backend-build, backend-test, backend-image]
    if: ${{ !cancelled() && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-job-group.py
          sparse-checkout-cone-mode: false

      - name: Require backend jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-job-group.py --optional backend-image <<< "$CI_NEEDS_JSON"

  # ============================================================
  # 前端检查（TypeScript）
  # 静态检查、站点单测、独立包、浏览器契约与镜像互不依赖，各自占一个 runner 并行；
  # frontend 汇总它们，保持既有 required check 名称。
  # ============================================================
  web-lint:
    name: Web lint
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Color guard 从基线提交读取白名单
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-web

      # biome check = lint + format + import 排序;
      # 此前跑 pnpm lint(biome lint)不查格式,CI 与本地红绿不一致(#140)
      - name: Biome check
        run: pnpm check

      - name: Color guard
        env:
          COLOR_GUARD_BASE: ${{ inputs.ref && 'HEAD^' || github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
        run: pnpm check:colors

      - name: Generated theme colors
        run: pnpm check:theme-colors

      - name: Generated persona colors
        run: pnpm check:persona-colors

  web-typecheck:
    name: Web typecheck
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-web
      - name: TypeScript check
        run: pnpm typecheck

  web-build:
    name: Web build
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-web
      - name: Build
        run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-contract-build
          overwrite: true
          path: web/dist
          retention-days: 2
          if-no-files-found: error
          include-hidden-files: true

  web-plan:
    name: Plan Web tests
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 10
    outputs:
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      contract_matrix: ${{ steps.plan.outputs.contract_matrix }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
      has_unit: ${{ steps.plan.outputs.has_unit }}
      has_contract: ${{ steps.plan.outputs.has_contract }}
      has_packages: ${{ steps.plan.outputs.has_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-web
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: web/.ci-test-history.json
          key: ci-test-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ github.sha }}
          restore-keys: ci-test-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - name: Generate routes
        run: pnpm --dir web generate-routes
      - name: Select and balance tests
        id: plan
        env:
          FULL: ${{ needs.changes.outputs.full }}
          BASE_SHA: ${{ needs.changes.outputs.base }}
        run: |
          args=(--output web/.ci-test-plan.json --history web/.ci-test-history.json)
          if [ "$FULL" = true ]; then args+=(--full); else args+=(--base "$BASE_SHA"); fi
          node web/scripts/ci-tests.mjs plan "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-test-plan
          overwrite: true
          path: web/.ci-test-plan.json
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: error

  # 站点测试按文件分片；带独立配置的包由 web-package 运行，不在此重复。
  web-unit:
    name: Web unit (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, runner, web-plan]
    if: needs.changes.outputs.web == 'true' && needs.web-plan.outputs.has_unit == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.web-plan.outputs.unit_matrix) }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-web

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-test-plan
          path: web
      - name: Generate routes
        run: pnpm generate-routes
      - name: Vitest
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-tests.mjs run --plan .ci-test-plan.json --kind unit --shard "$SHARD" --report-dir .ci-test-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-web-timings-unit-${{ matrix.shard }}
          overwrite: true
          path: web/.ci-test-reports
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

  # 公开包按发布边界独立验证：类型、测试与 tarball 消费；需要浏览器的包安装 Chromium。
  # inkline 的测试沿用站点 Vitest 配置，已在 web-unit 中运行。
  web-package:
    name: Web package (${{ matrix.package }})
    needs: [changes, runner, web-plan]
    if: needs.changes.outputs.web == 'true' && needs.web-plan.outputs.has_packages == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.web-plan.outputs.package_matrix) }}
    defaults:
      run:
        working-directory: web
    env:
      PACKAGE: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-web
        with:
          chromium: ${{ contains(fromJSON('["ui","kanban","theme"]'), matrix.package) && 'true' || 'false' }}

      - name: Architecture check
        if: matrix.package == 'ui'
        run: pnpm --filter "./packages/$PACKAGE" check

      - name: Typecheck
        run: pnpm --filter "./packages/$PACKAGE" typecheck

      - name: Test
        if: matrix.package != 'inkline'
        run: pnpm --filter "./packages/$PACKAGE" test

      - name: Real-browser tests
        if: matrix.package == 'kanban'
        run: pnpm --filter "./packages/$PACKAGE" browser

      - name: Independent tarball consumer
        run: pnpm --filter "./packages/$PACKAGE" consumer

  # 浏览器分片消费同一生产构建；单测、lint 和类型检查不等待构建。
  web-contract:
    name: Web contract (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, runner, web-plan, web-build]
    if: needs.changes.outputs.web == 'true' && needs.web-plan.outputs.has_contract == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.web-plan.outputs.contract_matrix) }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-web
        with:
          chromium: 'true'

      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-test-plan
          path: web
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: web-contract-build
          path: web/dist
      - name: Browser contracts
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci-tests.mjs run --plan .ci-test-plan.json --kind contract --shard "$SHARD" --report-dir .ci-test-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ci-web-timings-contract-${{ matrix.shard }}
          overwrite: true
          path: web/.ci-test-reports
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          overwrite: true
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  web-timings:
    name: Record test timings
    needs: [changes, runner, web-unit, web-contract]
    if: >-
      !cancelled() && needs.changes.outputs.publish_images == 'true' &&
      needs.web-unit.result == 'success' && needs.web-contract.result == 'success'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: web/.ci-test-history.json
          key: ci-test-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ github.sha }}
          restore-keys: ci-test-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          pattern: ci-web-timings-*
          path: web/.ci-test-reports
          merge-multiple: true
      - name: Merge successful duration samples
        run: node web/scripts/ci-tests.mjs history --reports web/.ci-test-reports --history web/.ci-test-history.json --output web/.ci-test-history.json
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: web/.ci-test-history.json
          key: ci-test-times-v1-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-${{ github.sha }}

  # 镜像校验:Dockerfile COPY 引用失效文件、lockfile 与依赖漂移等问题
  # 在此拦截,避免流入生产部署才暴露。只在相关文件变化、PR 之外的精确验证请求镜像时运行。
  web-image:
    name: Web image
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true' && needs.changes.outputs.web_image == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    permissions:
      actions: write   # buildx type=gha 缓存读写;workflow 级仅 contents:read 会把 actions 收为 none
      contents: read
      packages: write
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: needs.changes.outputs.publish_images == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker 镜像构建验证
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: image
        with:
          context: ./web
          push: ${{ needs.changes.outputs.publish_images == 'true' }}
          tags: ghcr.io/vod-studio/violet-web:sha-${{ inputs.ref || github.sha }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_SITE_URL=https://xunrua.top
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
          cache-from: type=gha,scope=violet-web
          cache-to: ${{ needs.changes.outputs.publish_images == 'true' && 'type=gha,mode=max,scope=violet-web' || '' }}

  frontend:
    name: Frontend (React)
    needs: [changes, web-plan, web-lint, web-typecheck, web-build, web-unit, web-package, web-contract, web-image]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-web-results.py
          sparse-checkout-cone-mode: false

      - name: Require frontend jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-web-results.py <<< "$CI_NEEDS_JSON"

  release-evidence:
    name: Release evidence
    needs: [changes, gate, backend-image, web-image]
    if: needs.changes.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Record exact full-CI evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          CI_FULL: ${{ needs.changes.outputs.full }}
          VERSION: ${{ needs.changes.outputs.version }}
          API_DIGEST: ${{ needs.backend-image.outputs.digest }}
          WEB_DIGEST: ${{ needs.web-image.outputs.digest }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          VALIDATE_RESULT: ${{ needs.gate.result }}
          BUILD_API_RESULT: ${{ needs.backend-image.result }}
          BUILD_WEB_RESULT: ${{ needs.web-image.result }}
        run: |
          python3 scripts/ci-release-evidence.py create \
            --revision "$GITHUB_SHA" --version "$VERSION" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --output release-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence-${{ github.run_attempt }}
          path: release-manifest.json
          retention-days: 30
          if-no-files-found: error

  notify-failure:
    name: Notify CI failure
    needs: [changes, gate, release-evidence]
    if: always() && failure() && needs.changes.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          run_id: ${{ github.run_id }}
          reason: 主干完整 CI 或镜像构建失败，未获得发布资格，不会触发部署

  # ============================================================
  # 依赖漏洞扫描
  # 漏洞只告警、不阻断 CI 与发版:修复要升级依赖,不应卡住无关改动;发现项进注解与任务摘要,
  # 升级走 dependabot 或人工。只有扫描工具自身执行失败才让本任务失败。
  # govulncheck 做 reachability 分析;Fixed-in-N/A 的(上游未发版)另行标注——
  # docker/docker 的 daemon 端漏洞(v1 +incompatible 永不修复,v2 尚在 beta),
  # violet 作为 client 不触发,属于模块级假阳性。
  # pnpm audit 无 reachability 分析,高危漏洞未必被实际调用。
  # 按变更侧裁剪:govulncheck 只查 api 依赖,pnpm audit 只查 web 依赖。
  # ============================================================
  dependency-scan:
    name: Dependency Scan
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        if: needs.changes.outputs.api == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        # pin 版本:@latest 行为漂移可能突然 break CI;升级走 dependabot 或人工
        if: needs.changes.outputs.api == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck (Go)
        # 非零退出时分流:输出含漏洞报告特征(Vulnerability #N / Fixed in:)走
        # Fixed-in 过滤;否则是工具自身执行错误(编译失败/网络等),必须失败——
        # 此前一律落入过滤逻辑,执行错误因无 "Fixed in:" 被吞成绿色 warning(#138)
        if: needs.changes.outputs.api == 'true'
        working-directory: api
        run: |
          set +e
          output=$(govulncheck ./... 2>&1)
          code=$?
          echo "$output"
          set -e
          [ "$code" -eq 0 ] && exit 0
          if ! echo "$output" | grep -qE "Vulnerability #[0-9]|Fixed in:"; then
            echo "::error::govulncheck 执行失败(exit ${code}),输出无漏洞报告特征,疑为工具自身错误"
            exit 1
          fi
          { echo '### govulncheck'; echo; echo '```'; echo "$output" | grep -E "^Vulnerability #|Module:|Fixed in:"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 提取有修复版本的漏洞(Fixed in: 非 N/A)
          fixable=$(echo "$output" | grep "Fixed in:" | grep -v "N/A" || true)
          if [ -n "$fixable" ]; then
            echo "::warning::发现可修复的可达漏洞(仅告警,不阻断),请升级依赖: $(echo "$fixable" | sed 's/^ *Fixed in: //' | sort -u | paste -sd ' ' -)"
          else
            echo "::warning::所有漏洞均为 Fixed-in-N/A,降级为 advisory"
          fi

      - name: Setup pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      # 只审计随站点发布的生产依赖;开发工具链的漏洞不进镜像。
      # 结果写入注解与任务摘要,避免 continue-on-error 让漏洞藏在绿色步骤里。
      - name: pnpm audit (frontend)
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: |
          if pnpm audit --prod --audit-level=high > "$RUNNER_TEMP/audit.txt" 2>&1; then
            cat "$RUNNER_TEMP/audit.txt"
            exit 0
          fi
          cat "$RUNNER_TEMP/audit.txt"
          counts=$(grep -E "vulnerabilities found|Severity:" "$RUNNER_TEMP/audit.txt" | paste -sd ' ' -)
          echo "::warning::生产依赖存在 high 及以上漏洞(仅告警,不阻断): ${counts:-审计未能完成}"
          { echo '### pnpm audit (production)'; echo; echo "${counts:-审计未能完成}"; } >> "$GITHUB_STEP_SUMMARY"

  # 总门禁:汇总变更检测、runner、基础设施与各侧结果,是唯一核对「被选中的任务必须 success」的地方。
  gate:
    name: CI Gate
    needs: [changes, runner, backend, frontend, dependency-scan, infrastructure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-ci-results.py
          sparse-checkout-cone-mode: false

      - name: Enforce selected checks
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py <<< "$CI_NEEDS_JSON"

  infrastructure:
    name: Infrastructure
    needs: [changes, runner]
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check self-hosted environment
        if: runner.environment == 'self-hosted' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infrastructure == 'true')
        run: bash deploy/github-runner/scripts/check-environment.sh

      - name: Check release version intent
        if: github.event_name == 'pull_request' && !inputs.ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$HEAD_BRANCH" == release-please--* ]]; then
            args+=(--release-pr)
          fi
          python3 scripts/check-release-version.py "${args[@]}"

      - name: Setup workflow checker toolchain
        if: needs.changes.outputs.infrastructure == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          cache: false

      - name: Install workflow checkers
        if: needs.changes.outputs.infrastructure == 'true'
        env:
          # rhysd/actionlint#654：官方已支持 queue，但 1.7.12 尚未识别；固定补丁源码而非屏蔽语法检查。
          ACTIONLINT_REVISION: 644076a59742c2d1540ebd4686eab3c308f0e562
          ACTIONLINT_SOURCE_SHA256: 747636d922cb81e66613ef80c5d08ff748de58d6d5250b9151853e8f680da3e1
          SHELLCHECK_VERSION: 0.11.0
        run: |
          tool_dir="$RUNNER_TEMP/workflow-tools"
          mkdir -p "$tool_dir"
          source_dir=$(mktemp -d "$RUNNER_TEMP/actionlint-source.XXXXXX")
          curl -fsSL --retry 3 "https://codeload.github.com/vvoland/actionlint/tar.gz/$ACTIONLINT_REVISION" -o "$tool_dir/actionlint-source.tar.gz"
          echo "$ACTIONLINT_SOURCE_SHA256  $tool_dir/actionlint-source.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/actionlint-source.tar.gz" --strip-components=1 -C "$source_dir"
          (cd "$source_dir" && go build -mod=readonly -trimpath -o "$tool_dir/actionlint" ./cmd/actionlint)
          curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$tool_dir/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $tool_dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$tool_dir/shellcheck.tar.xz" -C "$tool_dir" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$tool_dir" >> "$GITHUB_PATH"
          python_env=$(mktemp -d "$RUNNER_TEMP/workflow-python.XXXXXX")
          python3 -m venv "$python_env"
          "$python_env/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$python_env/bin" >> "$GITHUB_PATH"

      - name: Validate workflows and composite actions
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          printf 'self-hosted-runner:\n  labels: [rua, omarchy]\n' > "$RUNNER_TEMP/actionlint.yaml"
          actionlint -config-file "$RUNNER_TEMP/actionlint.yaml" -oneline
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import yaml

          config = pathlib.Path(os.environ["RUNNER_TEMP"]) / "actionlint.yaml"
          for path in sorted(pathlib.Path(".github/actions").rglob("action.y*ml")):
              action = yaml.safe_load(path.read_text())
              if action["runs"]["using"] != "composite":
                  continue
              inputs = {name: {**value, "type": "string"} for name, value in action.get("inputs", {}).items()}
              workflow = {
                  "on": {"workflow_call": {"inputs": inputs}},
                  "jobs": {"validate": {"runs-on": "ubuntu-latest", "steps": action["runs"]["steps"]}},
              }
              with tempfile.NamedTemporaryFile(mode="w", suffix=".yml") as fixture:
                  yaml.safe_dump(workflow, fixture)
                  fixture.flush()
                  print(f"Checking {path}", flush=True)
                  subprocess.run(["actionlint", "-config-file", str(config), "-oneline", fixture.name], check=True)
          PY

      - uses: ./.github/actions/setup-web
        if: needs.changes.outputs.infrastructure == 'true'

      - name: Test affected selection and shard planning
        if: needs.changes.outputs.infrastructure == 'true'
        run: node --test web/scripts/ci-tests.test.mjs

      - name: Deployment script tests
        if: needs.changes.outputs.infrastructure == 'true'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Shell syntax
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n scripts/hooks/pre-commit

      - name: Validate production compose
        if: needs.changes.outputs.infrastructure == 'true'
        env:
          DATABASE_USER: violet_ci
          DATABASE_PASSWORD: ci-only-placeholder
          RESOURCE_SIGNING_KEY: ci-only-placeholder-resource-signing-key
          BOT_TOKEN_KEY: ci-only-placeholder-bot-token-key
          CORS_ALLOWED_ORIGINS: https://ci.example.invalid
          API_IMAGE: ghcr.io/vod-studio/violet-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_IMAGE: ghcr.io/vod-studio/violet-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GOOGLE_CLIENT_ID: ''
          GITHUB_CLIENT_ID: ''
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cp docker-compose.prod.yml docker-compose.ci.yml "$temp_dir/"
          touch "$temp_dir/.env"
          docker compose --project-directory "$temp_dir" -f "$temp_dir/docker-compose.prod.yml" -f "$temp_dir/docker-compose.ci.yml" config --quiet
