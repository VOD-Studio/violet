name: CI

on:
  push:
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]
  workflow_call:
    inputs:
      ref:
        description: 精确验证的提交 SHA
        required: true
        type: string
      full:
        description: 强制执行双侧与基础设施检查
        type: boolean
        default: true
      build_images:
        description: 是否额外验证 Docker 镜像构建
        type: boolean
        default: false
      require_self_hosted:
        description: 强制自托管验收，禁止回退官方 runner
        type: boolean
        default: false

# PR 取消旧检查；主干与部署调用按提交隔离，后续 push 不取消待发布提交的检查。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.ref }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================
  # 变更侧检测：无关重任务在 job 级跳过，最终门禁核对实际执行结果
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ inputs.full && 'true' || steps.filter.outputs.api }}
      web: ${{ inputs.full && 'true' || steps.filter.outputs.web }}
      web_image: ${{ inputs.full && 'true' || steps.filter.outputs.web_image }}
      infrastructure: ${{ inputs.full && 'true' || steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # paths-filter 对比需要历史；只拉 commit/tree，blob 按需
          fetch-depth: 0
          filter: blob:none

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: ${{ !inputs.full }}
        id: filter
        with:
          initial-fetch-depth: '20'
          # 保留正向规则的 OR，同时让排除项生效；默认 some 会把否定模式也作为 OR。
          predicate-quantifier: some-with-excludes
          filters: |
            'api':
              - 'api/**'
              - '!api/README.md'
              - '.github/workflows/ci.yml'
              - 'scripts/check-ci-results.py'
              - 'scripts/tests/test_ci_results.py'
              - 'scripts/check-job-group.py'
              - 'scripts/tests/test_job_group.py'
            'web':
              - 'web/**'
              - '!web/README.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-npm.yml'
              - '.github/actions/setup-web/**'
              - 'scripts/check-ci-results.py'
              - 'scripts/tests/test_ci_results.py'
              - 'scripts/check-job-group.py'
              - 'scripts/tests/test_job_group.py'
            # 镜像校验只覆盖 Dockerfile、依赖与锁文件漂移；源码构建由契约任务验证。
            'web_image':
              - 'web/Dockerfile'
              - 'web/.dockerignore'
              - 'web/package.json'
              - 'web/pnpm-lock.yaml'
              - 'web/pnpm-workspace.yaml'
              - 'web/server.mjs'
              - 'web/packages/*/package.json'
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-web/**'
            'infrastructure':
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'Makefile'
              - 'release-please-config.json'
              - '.release-please-manifest.json'

  # 优先使用自托管 runner 216，不可用时退回官方 runner（见 pick-runner.yml）。
  runner:
    name: Pick runner
    uses: ./.github/workflows/pick-runner.yml
    with:
      require_self_hosted: ${{ inputs.require_self_hosted || false }}
    secrets: inherit

  # ============================================================
  # 后端检查（Go）
  # 静态检查、数据库测试与镜像校验互不依赖，并行执行；backend 汇总它们，保持既有 required check 名称。
  # ============================================================
  backend-lint:
    name: Backend lint
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      # govet 已在 .golangci.yml 启用并覆盖测试文件,不再单独跑 go vet。
      # 不用 action 的结果缓存:仅约 1MB 且恢复后仍需近 100 秒;go.sum 变化的 PR 会写出 PR 级缓存,
      # 之后同一份代码出现 staticcheck SA5011 误报(t.Fatal 后的空指针),删除缓存即恢复。
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: api
          args: --timeout 5m
          skip-cache: true

      - name: Go build
        run: go build ./...

  backend-test:
    name: Backend tests
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    env:
      APK_MIRROR: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 'mirrors.aliyun.com' || 'dl-cdn.alpinelinux.org' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: violet_ci
          POSTGRES_PASSWORD: violet_ci
          POSTGRES_DB: violet_test
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1073741824
          --health-cmd "pg_isready -U violet_ci -d violet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Prepare production WebP encoder
        run: |
          encoder_image="violet-webp-encoder:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --build-arg APK_MIRROR --target webp-builder --tag "$encoder_image" .
          encoder_container="$(docker create "$encoder_image" /bin/true)"
          trap 'docker rm -f "$encoder_container"; docker image rm "$encoder_image"' EXIT
          encoder_directory="$RUNNER_TEMP/violet-webp"
          mkdir -p "$encoder_directory"
          docker cp "${encoder_container}:/cwebp" "$encoder_directory/cwebp"
          chmod +x "$encoder_directory/cwebp"
          "$encoder_directory/cwebp" -version
          echo "$encoder_directory" >> "$GITHUB_PATH"

      - name: Go test
        env:
          BLOG_TEST_PG_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
        run: go test ./... -v -count=1

      - name: Migration integration tests
        env:
          MIGRATE_TEST_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
          CHAT_APPEARANCE_TEST_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
        run: go test -tags=integration ./internal/migrate ./internal/infrastructure/persistence/gorm/chatappearance -v -count=1

  backend-image:
    name: Backend image
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true' && (!inputs.ref || inputs.build_images)
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    permissions:
      actions: write   # buildx type=gha 缓存读写;workflow 级仅 contents:read 会把 actions 收为 none
      contents: read
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    env:
      APK_MIRROR: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 'mirrors.aliyun.com' || 'dl-cdn.alpinelinux.org' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker 镜像构建验证
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          push: false
          tags: violet-api:ci
          build-args: APK_MIRROR=${{ env.APK_MIRROR }}
          # scope 与 deploy.yml 构建一致:发版时 deploy 直接命中 CI 已构建的层;
          # PR 分支命中率低,仅主干 push 写缓存
          cache-from: type=gha,scope=violet-api
          cache-to: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/2.0') && 'type=gha,mode=max,scope=violet-api' || '' }}

  backend:
    name: Backend (Go)
    needs: [changes, backend-lint, backend-test, backend-image]
    if: ${{ !cancelled() && needs.changes.outputs.api == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-job-group.py
          sparse-checkout-cone-mode: false

      - name: Require backend jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-job-group.py --optional backend-image <<< "$CI_NEEDS_JSON"

  # ============================================================
  # 前端检查（TypeScript）
  # 静态检查、站点单测、独立包、浏览器契约与镜像互不依赖，各自占一个 runner 并行；
  # frontend 汇总它们，保持既有 required check 名称。
  # ============================================================
  web-static:
    name: Web static checks
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # Color guard 从基线提交读取白名单
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-web

      # biome check = lint + format + import 排序;
      # 此前跑 pnpm lint(biome lint)不查格式,CI 与本地红绿不一致(#140)
      - name: Biome check
        run: pnpm check

      - name: Color guard
        env:
          COLOR_GUARD_BASE: ${{ inputs.ref && 'HEAD^' || github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || 'HEAD^' }}
        run: pnpm check:colors

      - name: Generated theme colors
        run: pnpm check:theme-colors

      - name: Generated persona colors
        run: pnpm check:persona-colors

      - name: TypeScript check
        run: pnpm typecheck

  # 站点测试按文件分片；带独立配置的包由 web-package 运行，不在此重复。
  web-unit:
    name: Web unit (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-web

      - name: Vitest
        run: pnpm test:site --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # 公开包按发布边界独立验证：类型、测试与 tarball 消费；需要浏览器的包安装 Chromium。
  # inkline 的测试沿用站点 Vitest 配置，已在 web-unit 中运行。
  web-package:
    name: Web package (${{ matrix.package }})
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ui
            filter: '@violet/ui'
            check: true
            test: true
            chromium: true
          - package: inkline
            filter: '@violetjs/inkline'
          - package: react-tweet
            filter: '@violetjs/react-tweet'
            test: true
          - package: kanban
            filter: '@violetjs/kanban'
            test: true
            browser: true
            chromium: true
          - package: theme
            filter: '@violetjs/theme'
            test: true
            chromium: true
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-web
        with:
          chromium: ${{ matrix.chromium && 'true' || 'false' }}

      - name: Architecture check
        if: matrix.check
        run: pnpm --filter "${{ matrix.filter }}" check

      - name: Typecheck
        run: pnpm --filter "${{ matrix.filter }}" typecheck

      - name: Test
        if: matrix.test
        run: pnpm --filter "${{ matrix.filter }}" test

      - name: Real-browser tests
        if: matrix.browser
        run: pnpm --filter "${{ matrix.filter }}" browser

      - name: Independent tarball consumer
        run: pnpm --filter "${{ matrix.filter }}" consumer

  # 契约测试跑生产构建产物（server.mjs 读取 dist），各分片自行构建，构建本身仅十余秒。
  web-contract:
    name: Web contract (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: ./.github/actions/setup-web
        with:
          chromium: 'true'

      - name: Build
        run: pnpm build

      - name: Browser contracts
        run: pnpm test:contract --workers=2 --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: web/test-results
          retention-days: 7
          if-no-files-found: ignore

  # 镜像校验:Dockerfile COPY 引用失效文件、lockfile 与依赖漂移等问题
  # 在此拦截,避免流入生产部署才暴露。只在相关文件变化、PR 之外的精确验证请求镜像时运行。
  web-image:
    name: Web image
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true' && (inputs.build_images || (!inputs.ref && needs.changes.outputs.web_image == 'true'))
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 25 || 15 }}
    permissions:
      actions: write   # buildx type=gha 缓存读写;workflow 级仅 contents:read 会把 actions 收为 none
      contents: read
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker 镜像构建验证
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          push: false
          tags: violet-web:ci
          cache-from: type=gha,scope=violet-web
          cache-to: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/2.0') && 'type=gha,mode=max,scope=violet-web' || '' }}

  frontend:
    name: Frontend (React)
    needs: [changes, web-static, web-unit, web-package, web-contract, web-image]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-job-group.py
          sparse-checkout-cone-mode: false

      - name: Require frontend jobs
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-job-group.py --optional web-image <<< "$CI_NEEDS_JSON"

  # ============================================================
  # 依赖漏洞扫描
  # 漏洞只告警、不阻断 CI 与发版:修复要升级依赖,不应卡住无关改动;发现项进注解与任务摘要,
  # 升级走 dependabot 或人工。只有扫描工具自身执行失败才让本任务失败。
  # govulncheck 做 reachability 分析;Fixed-in-N/A 的(上游未发版)另行标注——
  # docker/docker 的 daemon 端漏洞(v1 +incompatible 永不修复,v2 尚在 beta),
  # violet 作为 client 不触发,属于模块级假阳性。
  # pnpm audit 无 reachability 分析,高危漏洞未必被实际调用。
  # 按变更侧裁剪:govulncheck 只查 api 依赖,pnpm audit 只查 web 依赖。
  # ============================================================
  dependency-scan:
    name: Dependency Scan
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        if: needs.changes.outputs.api == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        # pin 版本:@latest 行为漂移可能突然 break CI;升级走 dependabot 或人工
        if: needs.changes.outputs.api == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck (Go)
        # 非零退出时分流:输出含漏洞报告特征(Vulnerability #N / Fixed in:)走
        # Fixed-in 过滤;否则是工具自身执行错误(编译失败/网络等),必须失败——
        # 此前一律落入过滤逻辑,执行错误因无 "Fixed in:" 被吞成绿色 warning(#138)
        if: needs.changes.outputs.api == 'true'
        working-directory: api
        run: |
          set +e
          output=$(govulncheck ./... 2>&1)
          code=$?
          echo "$output"
          set -e
          [ "$code" -eq 0 ] && exit 0
          if ! echo "$output" | grep -qE "Vulnerability #[0-9]|Fixed in:"; then
            echo "::error::govulncheck 执行失败(exit ${code}),输出无漏洞报告特征,疑为工具自身错误"
            exit 1
          fi
          { echo '### govulncheck'; echo; echo '```'; echo "$output" | grep -E "^Vulnerability #|Module:|Fixed in:"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # 提取有修复版本的漏洞(Fixed in: 非 N/A)
          fixable=$(echo "$output" | grep "Fixed in:" | grep -v "N/A" || true)
          if [ -n "$fixable" ]; then
            echo "::warning::发现可修复的可达漏洞(仅告警,不阻断),请升级依赖: $(echo "$fixable" | sed 's/^ *Fixed in: //' | sort -u | paste -sd ' ' -)"
          else
            echo "::warning::所有漏洞均为 Fixed-in-N/A,降级为 advisory"
          fi

      - name: Setup pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      # 只审计随站点发布的生产依赖;开发工具链的漏洞不进镜像。
      # 结果写入注解与任务摘要,避免 continue-on-error 让漏洞藏在绿色步骤里。
      - name: pnpm audit (frontend)
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: |
          if pnpm audit --prod --audit-level=high > "$RUNNER_TEMP/audit.txt" 2>&1; then
            cat "$RUNNER_TEMP/audit.txt"
            exit 0
          fi
          cat "$RUNNER_TEMP/audit.txt"
          counts=$(grep -E "vulnerabilities found|Severity:" "$RUNNER_TEMP/audit.txt" | paste -sd ' ' -)
          echo "::warning::生产依赖存在 high 及以上漏洞(仅告警,不阻断): ${counts:-审计未能完成}"
          { echo '### pnpm audit (production)'; echo; echo "${counts:-审计未能完成}"; } >> "$GITHUB_STEP_SUMMARY"

  # 总门禁:汇总变更检测、runner、基础设施与各侧结果,是唯一核对「被选中的任务必须 success」的地方。
  gate:
    name: CI Gate
    needs: [changes, runner, backend, frontend, dependency-scan, infrastructure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-ci-results.py
          sparse-checkout-cone-mode: false

      - name: Enforce selected checks
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py <<< "$CI_NEEDS_JSON"

  infrastructure:
    name: Infrastructure
    needs: [changes, runner]
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check self-hosted environment
        if: runner.environment == 'self-hosted' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infrastructure == 'true')
        run: bash deploy/github-runner/scripts/check-environment.sh

      - name: Check release version intent
        if: github.event_name == 'pull_request' && !inputs.ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$HEAD_BRANCH" == release-please--* ]]; then
            args+=(--release-pr)
          fi
          python3 scripts/check-release-version.py "${args[@]}"

      - name: Install workflow checkers
        if: needs.changes.outputs.infrastructure == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          SHELLCHECK_VERSION: 0.11.0
        run: |
          tool_dir="$RUNNER_TEMP/workflow-tools"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$tool_dir/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $tool_dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$tool_dir/shellcheck.tar.xz" -C "$tool_dir" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$tool_dir" >> "$GITHUB_PATH"
          python_env=$(mktemp -d "$RUNNER_TEMP/workflow-python.XXXXXX")
          python3 -m venv "$python_env"
          "$python_env/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$python_env/bin" >> "$GITHUB_PATH"

      - name: Validate workflows and composite actions
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          printf 'self-hosted-runner:\n  labels: [rua, omarchy]\n' > "$RUNNER_TEMP/actionlint.yaml"
          actionlint -config-file "$RUNNER_TEMP/actionlint.yaml" -oneline
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import yaml

          config = pathlib.Path(os.environ["RUNNER_TEMP"]) / "actionlint.yaml"
          for path in sorted(pathlib.Path(".github/actions").rglob("action.y*ml")):
              action = yaml.safe_load(path.read_text())
              if action["runs"]["using"] != "composite":
                  continue
              inputs = {name: {**value, "type": "string"} for name, value in action.get("inputs", {}).items()}
              workflow = {
                  "on": {"workflow_call": {"inputs": inputs}},
                  "jobs": {"validate": {"runs-on": "ubuntu-latest", "steps": action["runs"]["steps"]}},
              }
              with tempfile.NamedTemporaryFile(mode="w", suffix=".yml") as fixture:
                  yaml.safe_dump(workflow, fixture)
                  fixture.flush()
                  print(f"Checking {path}", flush=True)
                  subprocess.run(["actionlint", "-config-file", str(config), "-oneline", fixture.name], check=True)
          PY

      - name: Deployment script tests
        if: needs.changes.outputs.infrastructure == 'true'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Shell syntax
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n scripts/hooks/pre-commit

      - name: Validate production compose
        if: needs.changes.outputs.infrastructure == 'true'
        env:
          DATABASE_USER: violet_ci
          DATABASE_PASSWORD: ci-only-placeholder
          RESOURCE_SIGNING_KEY: ci-only-placeholder-resource-signing-key
          BOT_TOKEN_KEY: ci-only-placeholder-bot-token-key
          CORS_ALLOWED_ORIGINS: https://ci.example.invalid
          API_IMAGE: ghcr.io/vod-studio/violet-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_IMAGE: ghcr.io/vod-studio/violet-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GOOGLE_CLIENT_ID: ''
          GITHUB_CLIENT_ID: ''
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cp docker-compose.prod.yml docker-compose.ci.yml "$temp_dir/"
          touch "$temp_dir/.env"
          docker compose --project-directory "$temp_dir" -f "$temp_dir/docker-compose.prod.yml" -f "$temp_dir/docker-compose.ci.yml" config --quiet
