name: CI

on:
  push:
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]
  workflow_call:
    inputs:
      ref:
        description: 精确验证的提交 SHA
        required: true
        type: string
      full:
        description: 强制执行双侧与基础设施检查
        type: boolean
        default: true
      build_images:
        description: 是否额外验证 Docker 镜像构建
        type: boolean
        default: false
      require_self_hosted:
        description: 强制自托管验收，禁止回退官方 runner
        type: boolean
        default: false

# PR 取消旧检查；主干与部署调用按提交隔离，后续 push 不取消待发布提交的检查。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !inputs.ref }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # ============================================================
  # 变更侧检测：无关重任务在 job 级跳过，最终门禁核对实际执行结果
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ inputs.full && 'true' || steps.filter.outputs.api }}
      web: ${{ inputs.full && 'true' || steps.filter.outputs.web }}
      infrastructure: ${{ inputs.full && 'true' || steps.filter.outputs.infrastructure }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          # paths-filter 对比需要历史；只拉 commit/tree，blob 按需
          fetch-depth: 0
          filter: blob:none

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        if: ${{ !inputs.full }}
        id: filter
        with:
          initial-fetch-depth: '20'
          # 保留正向规则的 OR，同时让排除项生效；默认 some 会把否定模式也作为 OR。
          predicate-quantifier: some-with-excludes
          filters: |
            'api':
              - 'api/**'
              - '!api/README.md'
              - '.github/workflows/ci.yml'
              - 'scripts/check-ci-results.py'
              - 'scripts/tests/test_ci_results.py'
            'web':
              - 'web/**'
              - '!web/README.md'
              - '.github/workflows/ci.yml'
              - '.github/workflows/publish-npm.yml'
              - 'scripts/check-ci-results.py'
              - 'scripts/tests/test_ci_results.py'
            'infrastructure':
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'deploy/**'
              - 'docker-compose*.yml'
              - '.env.example'
              - 'Makefile'
              - 'release-please-config.json'
              - '.release-please-manifest.json'

  # 优先使用自托管 runner 216，不可用时退回官方 runner（见 pick-runner.yml）。
  runner:
    name: Pick runner
    uses: ./.github/workflows/pick-runner.yml
    with:
      require_self_hosted: ${{ inputs.require_self_hosted || false }}
    secrets: inherit

  # ============================================================
  # 后端检查（Go）
  # ============================================================
  backend:
    name: Backend (Go)
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 40 || 20 }}
    permissions:
      actions: write   # buildx type=gha 缓存读写;workflow 级仅 contents:read 会把 actions 收为 none
      contents: read
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    env:
      APK_MIRROR: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 'mirrors.aliyun.com' || 'dl-cdn.alpinelinux.org' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: violet_ci
          POSTGRES_PASSWORD: violet_ci
          POSTGRES_DB: violet_test
        ports:
          - 5432/tcp
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,size=1073741824
          --health-cmd "pg_isready -U violet_ci -d violet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      # lint 前置到 build/test 之前:比 test 快,提前暴露静态错误,fail fast
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: api
          args: --timeout 5m

      - name: Go build
        run: go build ./...

      - name: Prepare production WebP encoder
        run: |
          encoder_image="violet-webp-encoder:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker build --build-arg APK_MIRROR --target webp-builder --tag "$encoder_image" .
          encoder_container="$(docker create "$encoder_image" /bin/true)"
          trap 'docker rm -f "$encoder_container"; docker image rm "$encoder_image"' EXIT
          encoder_directory="$RUNNER_TEMP/violet-webp"
          mkdir -p "$encoder_directory"
          docker cp "${encoder_container}:/cwebp" "$encoder_directory/cwebp"
          chmod +x "$encoder_directory/cwebp"
          "$encoder_directory/cwebp" -version
          echo "$encoder_directory" >> "$GITHUB_PATH"

      - name: Go test
        env:
          BLOG_TEST_PG_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
        run: go test ./... -v -count=1

      - name: Migration integration tests
        env:
          MIGRATE_TEST_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
          CHAT_APPEARANCE_TEST_DSN: postgres://violet_ci:violet_ci@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/violet_test?sslmode=disable
        run: go test -tags=integration ./internal/migrate ./internal/infrastructure/persistence/gorm/chatappearance -v -count=1

      - name: Setup Docker Buildx
        if: ${{ !inputs.ref || inputs.build_images }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Docker 镜像构建验证
        if: ${{ !inputs.ref || inputs.build_images }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./api
          push: false
          tags: violet-api:ci
          build-args: APK_MIRROR=${{ env.APK_MIRROR }}
          # scope 与 deploy.yml 构建一致:发版时 deploy 直接命中 CI 已构建的层;
          # PR 分支命中率低,仅主干 push 写缓存
          cache-from: type=gha,scope=violet-api
          cache-to: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/2.0') && 'type=gha,mode=max,scope=violet-api' || '' }}

  # ============================================================
  # 前端检查（TypeScript）
  # ============================================================
  frontend:
    name: Frontend (React)
    needs: [changes, runner]
    if: needs.changes.outputs.web == 'true'
    timeout-minutes: ${{ contains(fromJSON(needs.runner.outputs.labels), 'self-hosted') && 40 || 20 }}
    permissions:
      actions: write   # buildx type=gha 缓存读写;同 backend job
      contents: read
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # biome check = lint + format + import 排序;
      # 此前跑 pnpm lint(biome lint)不查格式,CI 与本地红绿不一致(#140)
      - name: Biome check
        run: pnpm check

      - name: TypeScript check
        run: pnpm typecheck

      - name: UI architecture and package tests
        run: pnpm --filter @violet/ui check && pnpm --filter @violet/ui typecheck && pnpm --filter @violet/ui test

      - name: UI independent tarball consumer
        run: pnpm --filter @violet/ui consumer

      - name: Public library types and tests
        run: |
          pnpm --filter @violetjs/inkline typecheck
          pnpm --filter @violetjs/inkline test
          pnpm --filter @violetjs/react-tweet typecheck
          pnpm --filter @violetjs/react-tweet test
          pnpm --filter @violetjs/kanban typecheck
          pnpm --filter @violetjs/kanban test

      - name: Public library independent tarball consumers
        run: |
          pnpm --filter @violetjs/inkline consumer
          pnpm --filter @violetjs/react-tweet consumer
          pnpm --filter @violetjs/kanban consumer

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          if [[ "$RUNNER_ENVIRONMENT" == self-hosted ]]; then
            pnpm exec playwright install chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi

      - name: Browser contracts
        run: pnpm test:contract --workers=2

      - name: Kanban real-browser tests
        run: pnpm --filter @violetjs/kanban browser

      - name: Setup Docker Buildx
        if: ${{ !inputs.ref || inputs.build_images }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # 镜像构建验证:Dockerfile COPY 引用失效文件、lockfile 与依赖漂移等问题
      # 在此拦截,避免流入生产部署才暴露
      - name: Docker 镜像构建验证
        if: ${{ !inputs.ref || inputs.build_images }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./web
          push: false
          tags: violet-web:ci
          cache-from: type=gha,scope=violet-web
          cache-to: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/2.0') && 'type=gha,mode=max,scope=violet-web' || '' }}

  # ============================================================
  # 依赖漏洞扫描
  # govulncheck 做 reachability 分析;有修复版本的漏洞阻断 CI,Fixed-in-N/A 的(上游未发版)
  # 降级为 warning——docker/docker 的 daemon 端漏洞(v1 +incompatible 永不修复,v2 尚在 beta),
  # violet 作为 client 不触发,属于模块级假阳性。
  # pnpm audit 无 reachability 分析,高危漏洞未必被实际调用,初期仅告警不阻断。
  # 待前端依赖基线清理后,移除 continue-on-error 升级为阻断。
  # 按变更侧裁剪:govulncheck 只查 api 依赖,pnpm audit 只查 web 依赖。
  # ============================================================
  dependency-scan:
    name: Dependency Scan
    needs: [changes, runner]
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    timeout-minutes: 10
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup Go
        if: needs.changes.outputs.api == 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: api/go.mod
          check-latest: true
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        # pin 版本:@latest 行为漂移可能突然 break CI;升级走 dependabot 或人工
        if: needs.changes.outputs.api == 'true'
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck (Go)
        # 非零退出时分流:输出含漏洞报告特征(Vulnerability #N / Fixed in:)走
        # Fixed-in 过滤;否则是工具自身执行错误(编译失败/网络等),必须失败——
        # 此前一律落入过滤逻辑,执行错误因无 "Fixed in:" 被吞成绿色 warning(#138)
        if: needs.changes.outputs.api == 'true'
        working-directory: api
        run: |
          set +e
          output=$(govulncheck ./... 2>&1)
          code=$?
          echo "$output"
          set -e
          [ "$code" -eq 0 ] && exit 0
          if ! echo "$output" | grep -qE "Vulnerability #[0-9]|Fixed in:"; then
            echo "::error::govulncheck 执行失败(exit ${code}),输出无漏洞报告特征,疑为工具自身错误"
            exit 1
          fi
          # 提取有修复版本的漏洞(Fixed in: 非 N/A)
          fixable=$(echo "$output" | grep "Fixed in:" | grep -v "N/A" || true)
          if [ -n "$fixable" ]; then
            echo "::error::发现可修复的漏洞,请升级依赖:"
            echo "$fixable"
            exit 1
          fi
          echo "::warning::所有漏洞均为 Fixed-in-N/A,降级为 advisory"

      - name: Setup pnpm
        if: needs.changes.outputs.web == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10

      - name: pnpm audit (frontend)
        if: needs.changes.outputs.web == 'true'
        working-directory: web
        run: pnpm audit --audit-level=high
        continue-on-error: true

  security:
    name: Dependency Security
    needs: [changes, runner, backend, frontend, dependency-scan, infrastructure]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          sparse-checkout: scripts/check-ci-results.py
          sparse-checkout-cone-mode: false

      - name: Enforce selected checks
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/check-ci-results.py <<< "$CI_NEEDS_JSON"

  infrastructure:
    name: Infrastructure
    needs: [changes, runner]
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          filter: blob:none

      - name: Check self-hosted environment
        if: runner.environment == 'self-hosted' && (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infrastructure == 'true')
        run: bash deploy/github-runner/scripts/check-environment.sh

      - name: Check release version intent
        if: github.event_name == 'pull_request' && !inputs.ref
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          args=(--base "$BASE_SHA" --head "$HEAD_SHA")
          if [[ "$HEAD_BRANCH" == release-please--* ]]; then
            args+=(--release-pr)
          fi
          python3 scripts/check-release-version.py "${args[@]}"

      - name: Install workflow checkers
        if: needs.changes.outputs.infrastructure == 'true'
        env:
          ACTIONLINT_VERSION: 1.7.12
          SHELLCHECK_VERSION: 0.11.0
        run: |
          tool_dir="$RUNNER_TEMP/workflow-tools"
          mkdir -p "$tool_dir"
          curl -fsSL --retry 3 "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" -o "$tool_dir/actionlint.tar.gz"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $tool_dir/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          curl -fsSL --retry 3 "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" -o "$tool_dir/shellcheck.tar.xz"
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $tool_dir/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf "$tool_dir/shellcheck.tar.xz" -C "$tool_dir" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          echo "$tool_dir" >> "$GITHUB_PATH"
          python_env=$(mktemp -d "$RUNNER_TEMP/workflow-python.XXXXXX")
          python3 -m venv "$python_env"
          "$python_env/bin/python" -m pip install --disable-pip-version-check PyYAML==6.0.3
          echo "$python_env/bin" >> "$GITHUB_PATH"

      - name: Validate workflows and composite actions
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          printf 'self-hosted-runner:\n  labels: [rua, omarchy]\n' > "$RUNNER_TEMP/actionlint.yaml"
          actionlint -config-file "$RUNNER_TEMP/actionlint.yaml" -oneline
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess
          import tempfile
          import yaml

          config = pathlib.Path(os.environ["RUNNER_TEMP"]) / "actionlint.yaml"
          for path in sorted(pathlib.Path(".github/actions").rglob("action.y*ml")):
              action = yaml.safe_load(path.read_text())
              if action["runs"]["using"] != "composite":
                  continue
              inputs = {name: {**value, "type": "string"} for name, value in action.get("inputs", {}).items()}
              workflow = {
                  "on": {"workflow_call": {"inputs": inputs}},
                  "jobs": {"validate": {"runs-on": "ubuntu-latest", "steps": action["runs"]["steps"]}},
              }
              with tempfile.NamedTemporaryFile(mode="w", suffix=".yml") as fixture:
                  yaml.safe_dump(workflow, fixture)
                  fixture.flush()
                  print(f"Checking {path}", flush=True)
                  subprocess.run(["actionlint", "-config-file", str(config), "-oneline", fixture.name], check=True)
          PY

      - name: Deployment script tests
        if: needs.changes.outputs.infrastructure == 'true'
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v

      - name: Shell syntax
        if: needs.changes.outputs.infrastructure == 'true'
        run: |
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)
          bash -n scripts/hooks/pre-commit

      - name: Validate production compose
        if: needs.changes.outputs.infrastructure == 'true'
        env:
          DATABASE_USER: violet_ci
          DATABASE_PASSWORD: ci-only-placeholder
          RESOURCE_SIGNING_KEY: ci-only-placeholder-resource-signing-key
          BOT_TOKEN_KEY: ci-only-placeholder-bot-token-key
          CORS_ALLOWED_ORIGINS: https://ci.example.invalid
          API_IMAGE: ghcr.io/vod-studio/violet-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          WEB_IMAGE: ghcr.io/vod-studio/violet-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          GOOGLE_CLIENT_ID: ''
          GITHUB_CLIENT_ID: ''
        run: |
          temp_dir=$(mktemp -d)
          trap 'rm -rf "$temp_dir"' EXIT
          cp docker-compose.prod.yml docker-compose.ci.yml "$temp_dir/"
          touch "$temp_dir/.env"
          docker compose --project-directory "$temp_dir" -f "$temp_dir/docker-compose.prod.yml" -f "$temp_dir/docker-compose.ci.yml" config --quiet
