# CI 流水线
#
# PR 和 push 到 main / release/2.0 时触发，并行跑后端与前端检查。
# 后端：go vet、go test、golangci-lint、build 与 Docker 镜像构建验证
# 前端：biome check、tsc、vitest 与 build
#
# 任一 job 失败则 PR 检查失败，阻止合并（ruleset required status checks）。
# release-please 的 release PR 只改 CHANGELOG 与 manifest，也必须跑 CI：
# 它是 required checks 的适用对象，paths-ignore 跳过的 check 永远 pending
# 无法合并（#142）。代价是每次发版多跑约 5 分钟 CI，远小于门禁价值。

name: CI

on:
  push:
    branches: [main, release/2.0]
  pull_request:
    branches: [main, release/2.0]

# 同一 PR 多次 push 时取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================
  # 后端检查（Go）
  # ============================================================
  backend:
    name: Backend (Go)
    timeout-minutes: 20
    permissions:
      actions: write   # buildx type=gha 缓存读写;workflow 级仅 contents:read 会把 actions 收为 none
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Go vet
        run: go vet ./...

      # lint 前置到 build/test 之前:比 test 快,提前暴露静态错误,fail fast
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          working-directory: api
          args: --timeout 5m

      - name: Go build
        run: go build ./...

      - name: Go test
        run: go test ./... -v -count=1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker 镜像构建验证
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: false
          tags: violet-api:ci
          # scope 与 deploy.yml 构建一致:发版时 deploy 直接命中 CI 已构建的层;
          # PR 分支命中率低,仅主干 push 写缓存
          cache-from: type=gha,scope=violet-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=violet-api' || '' }}

  # ============================================================
  # 前端检查（TypeScript）
  # ============================================================
  frontend:
    name: Frontend (React)
    timeout-minutes: 20
    permissions:
      actions: write   # buildx type=gha 缓存读写;同 backend job
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # biome check = lint + format + import 排序;
      # 此前跑 pnpm lint(biome lint)不查格式,CI 与本地红绿不一致(#140)
      - name: Biome check
        run: pnpm check

      - name: TypeScript check
        run: pnpm typecheck

      - name: Vitest
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 镜像构建验证:Dockerfile COPY 引用失效文件、lockfile 与依赖漂移等问题
      # 在此拦截,避免流入生产部署才暴露
      - name: Docker 镜像构建验证
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: violet-web:ci
          cache-from: type=gha,scope=violet-web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=max,scope=violet-web' || '' }}

  # ============================================================
  # 依赖漏洞扫描
  # govulncheck 做 reachability 分析;有修复版本的漏洞阻断 CI,Fixed-in-N/A 的(上游未发版)
  # 降级为 warning——docker/docker 的 daemon 端漏洞(v1 +incompatible 永不修复,v2 尚在 beta),
  # violet 作为 client 不触发,属于模块级假阳性。
  # pnpm audit 无 reachability 分析,高危漏洞未必被实际调用,初期仅告警不阻断。
  # 待前端依赖基线清理后,移除 continue-on-error 升级为阻断。
  # ============================================================
  security:
    name: Dependency Security
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: api/go.sum

      - name: Install govulncheck
        # pin 版本:@latest 行为漂移可能突然 break CI;升级走 dependabot 或人工
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: govulncheck (Go)
        # 非零退出时分流:输出含漏洞报告特征(Vulnerability #N / Fixed in:)走
        # Fixed-in 过滤;否则是工具自身执行错误(编译失败/网络等),必须失败——
        # 此前一律落入过滤逻辑,执行错误因无 "Fixed in:" 被吞成绿色 warning(#138)
        working-directory: api
        run: |
          set +e
          output=$(govulncheck ./... 2>&1)
          code=$?
          echo "$output"
          set -e
          [ "$code" -eq 0 ] && exit 0
          if ! echo "$output" | grep -qE "Vulnerability #[0-9]|Fixed in:"; then
            echo "::error::govulncheck 执行失败(exit ${code}),输出无漏洞报告特征,疑为工具自身错误"
            exit 1
          fi
          # 提取有修复版本的漏洞(Fixed in: 非 N/A)
          fixable=$(echo "$output" | grep "Fixed in:" | grep -v "N/A" || true)
          if [ -n "$fixable" ]; then
            echo "::error::发现可修复的漏洞,请升级依赖:"
            echo "$fixable"
            exit 1
          fi
          echo "::warning::所有漏洞均为 Fixed-in-N/A(上游未发修复版),降级为 advisory"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: pnpm audit (frontend)
        working-directory: web
        run: pnpm audit --audit-level=high
        continue-on-error: true
