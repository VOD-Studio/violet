name: Pick runner

# 日常选择允许回退；验收绕过启用开关，但 runner 不可用时必须失败。
# 调用方：jobs.<id>.runs-on: ${{ fromJSON(needs.<runner>.outputs.labels) }}
on:
  workflow_call:
    inputs:
      require_self_hosted:
        description: 强制自托管验收，禁止回退官方 runner
        type: boolean
        default: false
    secrets:
      RUNNER_STATUS_TOKEN:
        description: 只读「Self-hosted runners」组织权限的 token；缺省时一律使用官方 runner。
        required: false
    outputs:
      labels:
        description: runs-on 标签的 JSON 数组
        value: ${{ jobs.pick.outputs.labels }}

permissions:
  contents: read

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: pick
        env:
          REQUIRE_SELF_HOSTED: ${{ inputs.require_self_hosted }}
          ENABLED: ${{ vars.SELF_HOSTED_RUNNER }}
          TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          RUNNER_ID: "216"
          ORG: VOD-Studio
        run: bash scripts/pick-ci-runner.sh
