name: Pick runner

# 优先使用 org 自托管 runner 216；它离线、忙碌、不可信事件或无法查询时退回 GitHub 官方 runner。
# 调用方：jobs.<id>.runs-on: ${{ fromJSON(needs.<runner>.outputs.labels) }}
on:
  workflow_call:
    secrets:
      RUNNER_STATUS_TOKEN:
        description: 只读「Self-hosted runners」组织权限的 token；缺省时一律使用官方 runner。
        required: false
    outputs:
      labels:
        description: runs-on 标签的 JSON 数组
        value: ${{ jobs.pick.outputs.labels }}

permissions: {}

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        env:
          TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          EVENT: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
          RUNNER_ID: "216"
          ORG: VOD-Studio
        run: |
          fallback='["ubuntu-latest"]'
          preferred='["self-hosted","Linux","X64","omarchy"]'

          # 公开仓库：fork 的 PR 代码绝不能落到自托管 runner 上。
          if [ "$EVENT" = "pull_request" ] && [ "$HEAD_REPO" != "$REPO" ]; then
            echo "reason=fork pull request" >> "$GITHUB_STEP_SUMMARY"
            echo "labels=$fallback" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$TOKEN" ]; then
            echo "reason=RUNNER_STATUS_TOKEN not set" >> "$GITHUB_STEP_SUMMARY"
            echo "labels=$fallback" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          info=$(curl -fsS --max-time 10 \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/orgs/$ORG/actions/runners/$RUNNER_ID" 2>/dev/null) || info=""

          if [ -n "$info" ] && [ "$(jq -r '.status == "online" and .busy == false' <<<"$info")" = "true" ]; then
            echo "reason=runner $RUNNER_ID online and idle" >> "$GITHUB_STEP_SUMMARY"
            echo "labels=$preferred" >> "$GITHUB_OUTPUT"
          else
            echo "reason=runner $RUNNER_ID busy, offline or unreachable" >> "$GITHUB_STEP_SUMMARY"
            echo "labels=$fallback" >> "$GITHUB_OUTPUT"
          fi
