# PR 标题自动打 label：根据 Conventional Commit 前缀映射到 release notes 分类 label。
# release notes（.github/release.yml）按 PR label 分类，本 workflow 消除人工打标负担。
# 仅用官方 actions/github-script，无第三方供应链依赖。

name: Auto-label PR

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.pull_request.title;
            // Conventional Commit 前缀 → release notes label
            const map = {
              feat: 'enhancement',
              fix: 'bug',
              perf: 'performance',
              refactor: 'refactor',
              docs: 'documentation',
              ci: 'ci',
              chore: 'chore',
              test: 'test',
              style: 'style',
              revert: 'revert',
            };
            const m = title.match(/^(\w+)(\([^)]+\))?!?:/);
            if (!m) return;
            const label = map[m[1]];
            if (!label) return;
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: context.payload.pull_request.number,
              labels: [label],
            });
