# AI 代码评审
#
# PR 打开或更新时，用配置的 LLM（当前 MiniMax）自动评审 diff，评审意见以
# review 评论形式出现在 PR 的 File changes 页面。辅助人工 review，不构成合并门禁。
#
# 评审逻辑由独立的 GitHub Action VOD-Studio/inori 提供，支持任意 OpenAI 兼容接口。
# 首次使用前在仓库 Settings → Secrets and variables 添加 MINIMAX_API_KEY
# （platform.minimaxi.com 创建，按量计费 key 前缀 sk-）。未配置时本 workflow
# 跳过，不影响 PR 检查。
#
# 评审规则（注释规范、DDD 分层、Tailwind v4 简写等）在 .github/inori.yml 维护，
# 优先级：workflow inputs > .github/inori.yml > inori 内置默认。
#
# 排除：
#   - release-please 自动生成的 release PR（job 级 if 提前退出，不占 runner；
#     inori 的 ignore_bots 会兜底跳过其余 bot PR，如 dependabot）
#   - 锁文件与发版文本（inori 内置忽略清单，无需配置）

name: AI Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main, release/2.0]

# 同一 PR 多次 push 时取消旧评审，避免并发产生重复评论
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # 提交 review 评论

jobs:
  ai-review:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    env:
      MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: 检查 API key
        if: env.MINIMAX_API_KEY == ''
        run: echo "::warning::MINIMAX_API_KEY 未配置，AI 评审跳过。在 Settings → Secrets 添加后生效"

      - name: AI 评审
        if: env.MINIMAX_API_KEY != ''
        uses: VOD-Studio/inori@v0
        with:
          provider: minimax
          llm_api_key: ${{ secrets.MINIMAX_API_KEY }}
