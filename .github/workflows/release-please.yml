name: Release Please

# release-please 只维护版本候选 PR；Deploy 在完整验收后创建正式 tag 与 Release。
#
# 发版型 commit(feat/fix/perf/refactor 等)才会触发新版本;
# 纯 docs/chore/ci/build/test 改动不触发发版(changelog-sections 配置为 hidden,
# 全部 commit 均 hidden 时 changelog 为空,release-please 跳过开 PR)。
#
# 用 PAT 而非 GITHUB_TOKEN:组织策略禁止 GITHUB_TOKEN 创建 PR,PAT 绕过该限制。
# v4 自定义配置(tag-prefix / changelog-types 等)通过 manifest 配置文件传入。

on:
  push:
    branches: [release/2.0]
  # push 事件偶发不触发 Actions（曾整晚无 run）时的手动兜底：gh workflow run release-please.yml
  workflow_dispatch:

permissions:
  contents: write       # 创建与更新 release PR
  actions: read         # 失败告警读取运行状态
  pull-requests: write  # 开/合并 release PR
  issues: write         # 失败告警 issue(deploy-alert)


jobs:
  runner:
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  release-please:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    # 正常 10-20s,基线紊乱回溯全历史时 3m30s+;10 分钟上限兜住异常放大
    timeout-minutes: 10
    concurrency:
      group: release-state
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/2.0
          fetch-depth: 0
          persist-credentials: false
      - name: 检查待发布候选
        id: candidate
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/release-candidate.py maintenance
      - name: 检查当前发布批次的版本意图
        if: steps.candidate.outputs.maintain == 'true'
        run: |
          set -euo pipefail
          # 检查当前主干整批未发布提交，覆盖 PR 检查后基线又推进的情况。
          baseline=$(git log --first-parent -1 --format=%H -- .release-please-manifest.json)
          python3 scripts/check-release-version.py --base "$baseline" --head HEAD
          if previous=$(git rev-parse --verify "$baseline^" 2>/dev/null); then
            python3 scripts/check-release-version.py --base "$previous" --head "$baseline" --release-pr
          fi
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        if: steps.candidate.outputs.maintain == 'true'
        with:
          # PAT 绕过组织对 GITHUB_TOKEN 创建 PR 的限制
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          target-branch: release/2.0
          skip-github-release: true
          # v4 自定义配置走 manifest 文件
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json


      - name: release-please 失败告警
        # 候选尚未发布是正常等待；API 或版本意图检查失败仍需告警。
        if: failure()
        uses: ./.github/actions/deploy-alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          run_id: ${{ github.run_id }}
          reason: release PR 维护失败(API 或版本意图检查),详见 run 日志

  retry-on-failure:
    needs: [runner, release-please]
    # 不能在自身 run 进行中 gh run rerun:GitHub 要求 run 处终态(completed),
    # in-progress 调用返回 403。改用 gh workflow run 开新 run(dispatch 事件),
    # concurrency 排队等当前 run 结束后执行。
    # 防死循环:仅 push 触发的首次 attempt 失败才重试;重试出的 dispatch run
    # 失败不再重试(告警 issue 已留痕,deploy-alert 按 run id 去重)。
    if: failure() && github.event_name == 'push' && github.run_attempt == 1
    runs-on: ${{ fromJSON(needs.runner.outputs.labels || '["ubuntu-latest"]') }}
    permissions:
      actions: write   # gh workflow run 触发新 run
    steps:
      - name: 等待后触发新 run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          sleep 60
          gh workflow run release-please.yml --ref release/2.0
          echo "已触发重试 run: https://github.com/${GH_REPO}/actions/workflows/release-please.yml"
