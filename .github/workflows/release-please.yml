name: Release Please

# release-please 从 Conventional Commits 自动推导版本号 + 维护 CHANGELOG.md + 打 tag。
# 工作流:push 到 release/2.0 → release-please 开「release PR」(含待发 changelog)→
# 维护者 review 后合并 → 自动打 tag → 触发 deploy.yml(部署 api+web 到 rua 生产环境)。
#
# 发版型 commit(feat/fix/perf/refactor 等)才会触发新版本;
# 纯 docs/chore/ci/build/test 改动不触发发版(changelog-types 配置为 hidden)。
#
# v4 自定义配置(tag-prefix / changelog-types 等)通过 manifest 配置文件传入,
# 见 release-please-config.json。

on:
  push:
    branches: [release/2.0]

permissions:
  contents: write       # 创建 release PR + 打 tag
  pull-requests: write  # 开/合并 release PR

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # v4 自定义配置走 manifest 文件(workflow 只传文件路径)
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
