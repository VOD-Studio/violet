name: Auto Retry Deploy

on:
  workflow_run:
    workflows: [Deploy]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: '仅重试构建失败的 Deploy run ID'
        required: true

permissions:
  contents: read
  actions: write
  issues: write

concurrency:
  group: retry-deploy-${{ inputs.run_id || github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 重试构建失败
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: python3 scripts/retry-deploy.py "$RUN_ID"
      - name: 重试通道异常告警
        if: failure()
        uses: ./.github/actions/deploy-alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          run_id: ${{ inputs.run_id || github.event.workflow_run.id }}
          reason: 自动重试通道失败，请检查原始 Deploy run
