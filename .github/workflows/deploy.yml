name: Deploy

on:
  push:
    branches: [release/2.0]
    paths: ['.release-please-manifest.json']
  workflow_dispatch:
    inputs:
      version:
        description: '继续待发布候选或部署已有版本；回滚时填写服务器归档版本'
        required: false
        default: ''
      revision:
        description: '重新选定未发布候选的完整 SHA；留空保持已冻结候选'
        required: false
        default: ''
      skip_build:
        description: '从服务器归档回滚并暂停后续部署，不构建、不迁移数据库'
        type: boolean
        default: false
      resume:
        description: '显式恢复回滚后暂停的部署；仅成功部署后解除暂停'
        type: boolean
        default: false
      component:
        description: '部署或回滚组件'
        type: choice
        options: [both, api, web]
        default: both

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: release-state
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      version: ${{ steps.target.outputs.version }}
      revision: ${{ steps.target.outputs.revision }}
      manifest: ${{ steps.target.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 冻结或恢复发布候选
        id: target
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.version }}
          REVISION_INPUT: ${{ inputs.revision }}
          SKIP_BUILD: ${{ inputs.skip_build || false }}
          RESUME: ${{ inputs.resume || false }}
          COMPONENT: ${{ inputs.component || 'both' }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/release/2.0 ]; then
            echo '::error::发布协调必须从 release/2.0 工作流运行'
            exit 1
          fi
          if [ "$SKIP_BUILD" = true ] && [ "$RESUME" = true ]; then
            echo '::error::回滚与恢复部署不能同时请求'
            exit 1
          fi
          python3 scripts/release-candidate.py prepare \
            --version "$VERSION_INPUT" --revision "$REVISION_INPUT" \
            --rollback "$SKIP_BUILD" --component "$COMPONENT"

  # 检查与构建共享精确 SHA，发布检查不依赖容易被取消的主干 push run。
  validate:
    needs: prepare
    if: needs.prepare.outputs.mode == 'candidate'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      full: true
      build_images: false

  build-api:
    needs: prepare
    if: needs.prepare.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ./api
          push: true
          tags: ghcr.io/vod-studio/violet-api:sha-${{ needs.prepare.outputs.revision }}
          build-args: |
            API_VERSION=${{ needs.prepare.outputs.version }}
            APK_MIRROR=dl-cdn.alpinelinux.org
          cache-from: type=gha,scope=violet-api
          cache-to: type=gha,mode=max,scope=violet-api

  build-web:
    needs: prepare
    if: needs.prepare.outputs.mode == 'candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: ./web
          push: true
          tags: ghcr.io/vod-studio/violet-web:sha-${{ needs.prepare.outputs.revision }}
          build-args: |
            VITE_API_BASE_URL=/api/v1
            VITE_SITE_URL=https://xunrua.top
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            VITE_GITHUB_CLIENT_ID=${{ secrets.GH_CLIENT_ID }}
          cache-from: type=gha,scope=violet-web
          cache-to: type=gha,mode=max,scope=violet-web

  publish:
    needs: [prepare, validate, build-api, build-web]
    if: >-
      !cancelled() && needs.prepare.outputs.mode == 'candidate' &&
      needs.validate.result == 'success' &&
      needs.build-api.result == 'success' && needs.build-web.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-state
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      status: ${{ steps.release.outputs.status }}
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 发布已验收候选及不可变镜像清单
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          API_DIGEST: ${{ needs.build-api.outputs.digest }}
          WEB_DIGEST: ${{ needs.build-web.outputs.digest }}
          WORKFLOW_REVISION: ${{ github.workflow_sha }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_API_RESULT: ${{ needs.build-api.result }}
          BUILD_WEB_RESULT: ${{ needs.build-web.result }}
        run: |
          python3 scripts/release-candidate.py publish \
            --version "$VERSION" --revision "$REVISION" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --workflow-revision "$WORKFLOW_REVISION"

  maintain-release-pr:
    needs: [prepare, publish]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'reuse' ||
       (needs.publish.result == 'success' && needs.publish.outputs.status == 'published'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 更新下一批 release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-please.yml --ref release/2.0

  deploy:
    needs: [prepare, publish]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'rollback' || needs.prepare.outputs.mode == 'reuse' ||
       (needs.publish.result == 'success' && needs.publish.outputs.status == 'published'))
    runs-on: [self-hosted, rua]
    environment: production
    timeout-minutes: 25
    # 只有生产事务互斥；候选版本的检查与构建不占生产锁。
    concurrency:
      group: deploy-production
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      HTTP_PROXY: http://127.0.0.1:20171
      HTTPS_PROXY: http://127.0.0.1:20171
      GIT_HTTP_LOW_SPEED_LIMIT: '1024'
      GIT_HTTP_LOW_SPEED_TIME: '30'
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.prepare.outputs.mode != 'rollback'
        timeout-minutes: 6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: release-source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: 登录镜像仓库
        if: needs.prepare.outputs.mode != 'rollback'
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/violet-registry-auth.json
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=0
            printf '%s' "$GH_TOKEN" |
              timeout --kill-after=5s 60s podman login ghcr.io -u "$GH_ACTOR" --password-stdin ||
              status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::GHCR 登录三次失败，未执行部署事务'
              exit "$status"
            fi
            echo "::warning::GHCR 登录失败（退出码 ${status}），准备第 $((attempt + 1)) 次尝试"
            sleep "$((attempt * 5))"
          done
      - name: 执行部署事务
        id: deploy
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MANIFEST: ${{ needs.publish.outputs.manifest || needs.prepare.outputs.manifest }}
          MODE: ${{ needs.prepare.outputs.mode }}
          RESUME: ${{ inputs.resume || false }}
          COMPONENT: ${{ inputs.component || 'both' }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/violet-registry-auth.json
        run: |
          set -euo pipefail
          if [ "$MODE" = rollback ]; then
            python3 scripts/deploy-release.py --rollback "$VERSION" --component "$COMPONENT"
          else
            printf '%s\n' "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
            args=(--manifest "$RUNNER_TEMP/release-manifest.json" --source-root release-source --component "$COMPONENT")
            if [ "$RESUME" = true ]; then
              args+=(--resume)
            fi
            python3 scripts/deploy-release.py "${args[@]}"
          fi
      - name: 清理仓库凭据
        if: always()
        run: rm -f "$RUNNER_TEMP/violet-registry-auth.json"

  notify-failure:
    needs: [prepare, validate, build-api, build-web, publish, maintain-release-pr, deploy]
    if: always() && failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          run_id: ${{ github.run_id }}
          reason: 检查或部署失败；生产事务失败后请检查归档与恢复结果，不自动重试迁移或切换
