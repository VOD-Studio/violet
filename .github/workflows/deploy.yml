name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [release/2.0]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: '继续待发布候选或部署已有版本；回滚时填写服务器归档版本'
        required: false
        default: ''
      revision:
        description: '选择已有完整 CI 验收证据的 SHA；留空继续已冻结候选'
        required: false
        default: ''
      skip_build:
        description: '从服务器归档回滚并暂停后续部署，不构建、不迁移数据库'
        type: boolean
        default: false
      resume:
        description: '显式恢复回滚后暂停的部署；仅成功部署后解除暂停'
        type: boolean
        default: false
      component:
        description: '部署或回滚组件'
        type: choice
        options: [both, api, web]
        default: both

permissions:
  contents: read

jobs:
  runner:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/release/2.0') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'release/2.0' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(fromJSON('["push","workflow_dispatch"]'), github.event.workflow_run.event))
    uses: ./.github/workflows/pick-runner.yml
    secrets:
      RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}

  prepare:
    needs: runner
    # 非主干的手动请求在官方 runner 报错，不交给自托管机。
    if: >-
      !cancelled() && (needs.runner.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/release/2.0'))
    runs-on: ${{ fromJSON(needs.runner.outputs.labels || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    concurrency:
      group: release-state
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    outputs:
      mode: ${{ steps.target.outputs.mode }}
      version: ${{ steps.target.outputs.version }}
      revision: ${{ steps.target.outputs.revision }}
      manifest: ${{ steps.target.outputs.manifest }}
      api_digest: ${{ steps.verified.outputs.api_digest }}
      web_digest: ${{ steps.verified.outputs.web_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/2.0
          fetch-depth: 0
          persist-credentials: false
      - name: 冻结或恢复发布候选
        id: target
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION_INPUT: ${{ inputs.version }}
          REVISION_INPUT: ${{ inputs.revision }}
          SKIP_BUILD: ${{ inputs.skip_build || false }}
          RESUME: ${{ inputs.resume || false }}
          COMPONENT: ${{ inputs.component || 'both' }}
          CI_REVISION: ${{ github.event.workflow_run.head_sha }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != refs/heads/release/2.0 ]; then
            echo '::error::发布协调必须从 release/2.0 工作流运行'
            exit 1
          fi
          if [ "$SKIP_BUILD" = true ] && [ "$RESUME" = true ]; then
            echo '::error::回滚与恢复部署不能同时请求'
            exit 1
          fi
          revision="$REVISION_INPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then revision="$CI_REVISION"; fi
          python3 scripts/release-candidate.py prepare \
            --version "$VERSION_INPUT" --revision "$revision" \
            --rollback "$SKIP_BUILD" --component "$COMPONENT"

      - name: Retrieve verified CI evidence
        if: steps.target.outputs.mode == 'candidate'
        id: verified
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REVISION: ${{ steps.target.outputs.revision }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          args=(--revision "$REVISION" --output "$RUNNER_TEMP/release-manifest.json")
          if [ -n "$CI_RUN_ID" ]; then args+=(--run-id "$CI_RUN_ID"); fi
          python3 scripts/ci-release-evidence.py fetch "${args[@]}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.target.outputs.mode == 'candidate'
        with:
          name: verified-release-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-manifest.json
          retention-days: 7
          if-no-files-found: error


  publish:
    needs: [runner, prepare]
    if: needs.prepare.outputs.mode == 'candidate'
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 10
    concurrency:
      group: release-state
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
    outputs:
      status: ${{ steps.release.outputs.status }}
      manifest: ${{ steps.release.outputs.manifest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/2.0
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: verified-release-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/verified-release
      - name: 发布已验收候选及不可变镜像清单
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.prepare.outputs.version }}
          REVISION: ${{ needs.prepare.outputs.revision }}
          API_DIGEST: ${{ needs.prepare.outputs.api_digest }}
          WEB_DIGEST: ${{ needs.prepare.outputs.web_digest }}
        run: |
          python3 scripts/release-candidate.py publish \
            --version "$VERSION" --revision "$REVISION" \
            --api-digest "$API_DIGEST" --web-digest "$WEB_DIGEST" \
            --verification "$RUNNER_TEMP/verified-release/release-manifest.json"

  maintain-release-pr:
    needs: [runner, prepare, publish]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'reuse' ||
       (needs.publish.result == 'success' && needs.publish.outputs.status == 'published'))
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: 更新下一批 release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run release-please.yml --ref release/2.0

  deploy:
    needs: [prepare, publish]
    if: >-
      always() && !cancelled() && needs.prepare.result == 'success' &&
      (needs.prepare.outputs.mode == 'rollback' || needs.prepare.outputs.mode == 'reuse' ||
       (needs.publish.result == 'success' && needs.publish.outputs.status == 'published'))
    runs-on: [self-hosted, rua]
    environment: production
    timeout-minutes: 25
    # CI 已完成验收；这里只串行生产事务，不运行应用检查或构建。
    concurrency:
      group: deploy-production
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    env:
      HTTP_PROXY: http://127.0.0.1:20171
      HTTPS_PROXY: http://127.0.0.1:20171
      GIT_HTTP_LOW_SPEED_LIMIT: '1024'
      GIT_HTTP_LOW_SPEED_TIME: '30'
    outputs:
      status: ${{ steps.deploy.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        timeout-minutes: 3
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: needs.prepare.outputs.mode != 'rollback'
        timeout-minutes: 6
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          path: release-source
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: 登录镜像仓库
        if: needs.prepare.outputs.mode != 'rollback'
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/violet-registry-auth.json
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            status=0
            printf '%s' "$GH_TOKEN" |
              timeout --kill-after=5s 60s podman login ghcr.io -u "$GH_ACTOR" --password-stdin ||
              status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo '::error::GHCR 登录三次失败，未执行部署事务'
              exit "$status"
            fi
            echo "::warning::GHCR 登录失败（退出码 ${status}），准备第 $((attempt + 1)) 次尝试"
            sleep "$((attempt * 5))"
          done
      - name: 执行部署事务
        id: deploy
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MANIFEST: ${{ needs.publish.outputs.manifest || needs.prepare.outputs.manifest }}
          MODE: ${{ needs.prepare.outputs.mode }}
          RESUME: ${{ inputs.resume || false }}
          COMPONENT: ${{ inputs.component || 'both' }}
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/violet-registry-auth.json
        run: |
          set -euo pipefail
          if [ "$MODE" = rollback ]; then
            python3 scripts/deploy-release.py --rollback "$VERSION" --component "$COMPONENT"
          else
            printf '%s\n' "$MANIFEST" > "$RUNNER_TEMP/release-manifest.json"
            args=(--manifest "$RUNNER_TEMP/release-manifest.json" --source-root release-source --component "$COMPONENT")
            if [ "$RESUME" = true ]; then
              args+=(--resume)
            fi
            python3 scripts/deploy-release.py "${args[@]}"
          fi
      - name: 清理仓库凭据
        if: always()
        run: rm -f "$RUNNER_TEMP/violet-registry-auth.json"

  notify-failure:
    needs: [runner, prepare, publish, maintain-release-pr, deploy]
    if: always() && failure()
    runs-on: ${{ fromJSON(needs.runner.outputs.labels || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: release/2.0
          persist-credentials: false
      - uses: ./.github/actions/deploy-alert
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          run_id: ${{ github.run_id }}
          reason: 发布或部署失败；CI 证据不会被重跑替代，迁移与生产切换需人工核对恢复结果
