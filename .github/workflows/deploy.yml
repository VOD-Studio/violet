# CD 发布流水线
#
# 触发:
#   - 打 v* tag: 自动发版到 rua 生产环境(release-please 合并 release PR 时触发)
#   - workflow_dispatch: 手动触发,可选 version 回滚到历史 tag,可选 component 单组件部署
#
# 运行在 rua 的 self-hosted runner 上,本地构建并部署,不穿越 GFW、无需镜像仓库。
# 流程: 构建 → 迁移门禁 → 部署 api → 健康检查 → 部署 web → sync-client → 创建 Release
# 单组件回滚: workflow_dispatch 选 component=api/web,只重建对应容器,复用缓存镜像

name: Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '目标版本 tag，用于手动回滚，如 v2.0.1。留空则部署触发的 tag。'
        required: false
        default: ''
      skip_build:
        description: '跳过构建，回滚时复用本地缓存镜像'
        required: false
        type: boolean
        default: false
      component:
        description: '部署/回滚目标组件: both(默认,api+web) / api / web'
        required: false
        type: choice
        options:
          - both
          - api
          - web
        default: both

# 生产部署串行，绝不并发、绝不取消进行中的部署
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write   # 创建 GitHub Release 需要

jobs:
  deploy:
    name: 部署到 rua 生产环境
    runs-on: [self-hosted, rua]
    environment: production
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: 解析目标版本
        id: ver
        env:
          VER_INPUT: ${{ inputs.version }}
        run: |
          if [ -n "$VER_INPUT" ]; then
            echo "tag=$VER_INPUT" >> "$GITHUB_OUTPUT"
            echo "rollback=true" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "rollback=false" >> "$GITHUB_OUTPUT"
          fi
          echo "目标版本: ${{ steps.ver.outputs.tag }}"

      - name: 快照当前线上版本作为回滚目标
        id: prev
        run: |
          PREV=""
          if [ -f /root/docker/violet/.current-version ]; then
            PREV="$(cat /root/docker/violet/.current-version)"
          fi
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "当前线上版本: ${PREV:-无，疑似首次部署}"

      - name: Checkout 代码
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: 构建 api 镜像
        if: ${{ inputs.skip_build != 'true' && inputs.component != 'web' }}
        run: |
          docker build \
            -t violet-api:${{ steps.ver.outputs.tag }} \
            -t violet-api:latest \
            -f api/Dockerfile api/
          echo "已构建 violet-api:${{ steps.ver.outputs.tag }} 与 violet-api:latest"

      - name: 构建 web 镜像
        if: ${{ inputs.skip_build != 'true' && inputs.component != 'api' }}
        run: |
          # build args 从线上 .env 读取(OAuth client id 等),保持与现网配置一致
          set -a; . /root/docker/violet/.env; set +a
          docker build \
            -t violet-web:${{ steps.ver.outputs.tag }} \
            -t violet-web:latest \
            --build-arg "VITE_API_BASE_URL=${VITE_API_BASE_URL:-/api/v1}" \
            --build-arg "VITE_SITE_URL=${VITE_SITE_URL:-https://xunrua.top}" \
            --build-arg "VITE_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            --build-arg "VITE_GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}" \
            -f web/Dockerfile web/
          echo "已构建 violet-web:${{ steps.ver.outputs.tag }} 与 violet-web:latest"

      - name: 回滚模式复用缓存 api 镜像
        if: ${{ inputs.skip_build == 'true' && inputs.component != 'web' }}
        run: |
          docker image inspect violet-api:${{ steps.ver.outputs.tag }} >/dev/null 2>&1 || { echo "::error::rua 本地无 violet-api:${{ steps.ver.outputs.tag }} 镜像，回滚中止"; exit 1; }
          docker tag violet-api:${{ steps.ver.outputs.tag }} violet-api:latest
          echo "已将 violet-api:${{ steps.ver.outputs.tag }} 复用为 latest"

      - name: 回滚模式复用缓存 web 镜像
        if: ${{ inputs.skip_build == 'true' && inputs.component != 'api' }}
        run: |
          docker image inspect violet-web:${{ steps.ver.outputs.tag }} >/dev/null 2>&1 || { echo "::error::rua 本地无 violet-web:${{ steps.ver.outputs.tag }} 镜像，回滚中止"; exit 1; }
          docker tag violet-web:${{ steps.ver.outputs.tag }} violet-web:latest
          echo "已将 violet-web:${{ steps.ver.outputs.tag }} 复用为 latest"

      - name: 同步 compose 文件到部署目录
        run: |
          cp docker-compose.prod.yml /root/docker/violet/docker-compose.prod.yml
          cp docker-compose.ci.yml   /root/docker/violet/docker-compose.ci.yml

      - name: 一次性迁移 env 文件(api/.env → .env)
        working-directory: /root/docker/violet
        run: |
          # 配置架构重构后根 .env 是唯一 env 文件;老服务器目录一次性迁移
          if [ -f api/.env ] && [ ! -f .env ]; then
            cp api/.env .env
            echo "已迁移 api/.env → .env"
          fi

      - name: 数据库迁移门禁
        # 只部署 web 时跳过(api 没变,无需迁移)
        if: ${{ inputs.component != 'web' }}
        id: migrate
        working-directory: /root/docker/violet
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            run --rm --no-deps --entrypoint /migrate api up

      - name: 部署 api 服务
        if: ${{ inputs.component != 'web' }}
        id: deploy
        working-directory: /root/docker/violet
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            up -d --no-build --no-deps api

      - name: api 健康检查
        if: ${{ inputs.component != 'web' }}
        id: health
        working-directory: /root/docker/violet
        run: |
          for i in $(seq 1 15); do
            if docker compose exec -T api wget -qO- http://localhost:9090/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "api 健康检查通过，第 ${i} 次尝试"
              exit 0
            fi
            echo "等待 api 就绪 (${i}/15)..."
            sleep 6
          done
          echo "::error::api 健康检查失败，api 未在超时内就绪"
          exit 1

      - name: 部署 web 服务
        if: ${{ inputs.component != 'api' }}
        id: deploy-web
        working-directory: /root/docker/violet
        run: |
          docker compose \
            -f docker-compose.prod.yml \
            -f docker-compose.ci.yml \
            up -d --no-build --no-deps web

      - name: 同步 web 静态资源
        # web 重建后必须同步 dist/client 到 nginx-proxy 共享目录,否则 hash 不匹配白屏
        if: ${{ inputs.component != 'api' }}
        working-directory: /root/docker/violet
        run: |
          SHARED_DIR=/root/docker/nginx-proxy/blog-client
          rm -rf "$SHARED_DIR"/* && mkdir -p "$SHARED_DIR"
          docker cp blog-web:/app/dist/client/. "$SHARED_DIR"/
          echo "静态资源已同步到 $SHARED_DIR ($(ls "$SHARED_DIR" | wc -l) 个条目)"

      - name: web 健康检查
        if: ${{ inputs.component != 'api' }}
        id: health-web
        working-directory: /root/docker/violet
        run: |
          for i in $(seq 1 15); do
            if docker compose exec -T web wget -qO- http://127.0.0.1:3000/ 2>/dev/null | grep -q '<title>'; then
              echo "web 健康检查通过，第 ${i} 次尝试"
              exit 0
            fi
            echo "等待 web 就绪 (${i}/15)..."
            sleep 6
          done
          echo "::error::web 健康检查失败,web 未在超时内就绪"
          exit 1

      - name: 自动回滚到上一版本
        if: failure() && steps.migrate.outcome == 'success' && steps.prev.outputs.prev_tag != '' && steps.ver.outputs.rollback != 'true'
        working-directory: /root/docker/violet
        run: |
          PREV="${{ steps.prev.outputs.prev_tag }}"
          echo "部署失败，自动回滚到 ${PREV}"
          # api 回滚(若本次部署了 api)
          if [ "${{ inputs.component }}" != "web" ] && docker image inspect violet-api:"${PREV}" >/dev/null 2>&1; then
            docker tag "violet-api:${PREV}" violet-api:latest
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --no-build --no-deps api
            echo "已回滚 api 到 ${PREV}"
          fi
          # web 回滚(若本次部署了 web)
          if [ "${{ inputs.component }}" != "api" ] && docker image inspect violet-web:"${PREV}" >/dev/null 2>&1; then
            docker tag "violet-web:${PREV}" violet-web:latest
            docker compose -f docker-compose.prod.yml -f docker-compose.ci.yml up -d --no-build --no-deps web
            SHARED_DIR=/root/docker/nginx-proxy/blog-client
            rm -rf "$SHARED_DIR"/* && mkdir -p "$SHARED_DIR"
            docker cp blog-web:/app/dist/client/. "$SHARED_DIR"/
            echo "已回滚 web 到 ${PREV}"
          fi
          for i in $(seq 1 10); do
            if docker compose exec -T api wget -qO- http://localhost:9090/api/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "回滚成功，线上已恢复到 ${PREV}"
              exit 0
            fi
            sleep 6
          done
          echo "::error::回滚后健康检查仍失败，需人工介入"
          exit 1

      - name: 更新版本锚点
        if: success() && steps.ver.outputs.rollback != 'true'
        run: |
          echo "${{ steps.ver.outputs.tag }}" > /root/docker/violet/.current-version
          echo "版本锚点已更新为 ${{ steps.ver.outputs.tag }}"

      - name: 从 CHANGELOG 抽取本版本段落
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.tag }}"
          VERSION="${VERSION#v}"
          # 匹配 `## [X.Y.Z]` 标题(兼容 ctv 生成的 `## [X.Y.Z](compare-url)` 形式),
          # 抽到下一个 `## [` 标题为止
          awk -v ver="$VERSION" '
            /^## \[/ {
              if (substr($0, 5, length(ver)) == ver && substr($0, 5 + length(ver), 1) == "]") {
                found = 1; print; next
              } else if (found) { exit }
            }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
          if [ -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
            echo "已从 CHANGELOG.md 抽取 [$VERSION] 段落 ($(wc -l < "$RUNNER_TEMP/release-notes.md") 行)"
          else
            echo "source=generated" >> "$GITHUB_OUTPUT"
            echo "::warning::CHANGELOG.md 未找到 [$VERSION] 段落,回退到自动生成 release notes"
          fi

      - name: 创建 GitHub Release(CHANGELOG 段落)
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.source == 'changelog'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md

      - name: 创建 GitHub Release(自动生成 notes)
        if: success() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && steps.notes.outputs.source == 'generated'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
