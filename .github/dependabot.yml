# 依赖自动更新:govulncheck/pnpm audit 发现的漏洞需要自动修复通道,否则会积压(#143)
# 每周一拉取;minor/patch 合并为一个 PR 减少噪音,major 单独开 PR 便于单独评估

version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      minor-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
