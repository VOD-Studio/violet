# 生产环境配置
# 使用: docker compose -f docker-compose.prod.yml up -d
#
# 前置条件:
# 1. 复制 .env.example 为 .env 并修改配置(特别是 DATABASE_PASSWORD 和 SUPERADMIN_PASSWORD)
# 2. 上传文件由命名卷 uploads_data 持久化，无需手动创建宿主机目录

services:
  # PostgreSQL 数据库
  postgres:
    # 用全限定镜像名，避免 podman 误匹配到 localhost/ 下残留的错误架构镜像
    image: docker.io/library/postgres:16-alpine
    container_name: blog-postgres
    restart: always
    # 端口不对外暴露，仅内部网络访问
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DATABASE_USER:?DATABASE_USER is required (set in .env)}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required (set in .env)}
      POSTGRES_DB: ${DATABASE_NAME:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME:-blog}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # Redis 缓存
  redis:
    image: docker.io/library/redis:7-alpine
    container_name: blog-redis
    restart: always
    # 端口不对外暴露，仅内部网络访问
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend

  # Go API 服务
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: localhost/violet-api:latest
    container_name: blog-api
    restart: always
    # API Dockerfile 创建 UID/GID 65532 的非 root 用户，
    # 密钥由 scripts/init-production.sh 设为 65532:65532 或 chmod 644 可读
    # 端口不对外暴露，通过 nginx-proxy 反向代理 /api/v1/
    expose:
      - "9090"
    env_file:
      - ./.env
    environment:
      # 生产环境标识:必须硬编码,不依赖 .env——缺失时会静默落到 development,
      # 导致验证码明文打印到生产日志、生产安全校验全部跳过
      ENVIRONMENT: production

      # 覆盖数据库连接为内部 Docker 网络地址(API 代码读取 DATABASE_* 变量)
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-blog}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSLMODE: disable
      # 覆盖 Redis 连接为内部 Docker 网络地址
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""

      # 生产安全基线:HTTPS 才下发 Cookie;CORS 必须在 .env 显式配置真实域名
      # (CORS_ALLOWED_ORIGINS 逗号分隔,如 https://example.com,https://www.example.com)
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required (set in .env)}

      # OAuth 外呼(Google/GitHub userinfo)走宿主机 v2ray 分流代理:腾讯云国内机
      # 直连 googleapis 被 GFW 掐断,Google 登录一直超时。20172 是 v2rayA 分流
      # 端口,国内域名(B 站等)仍直连。v2ray 只监听宿主机 loopback,bridge 容器
      # 经 socat 中继访问(host.containers.internal 见 socat-v2ray@.service,
      # 部署步骤见 docs/deploy/manual-deploy.md)
      HTTPS_PROXY: http://host.containers.internal:20172
      HTTP_PROXY: http://host.containers.internal:20172
      NO_PROXY: localhost,127.0.0.1,::1,postgres,redis,10.89.0.0/16
    volumes:
      # 持久化上传文件
      - uploads_data:/app/uploads
      # 代码运行器：挂载宿主 docker/podman sock 起隔离容器执行用户代码。
      # 生产 podman：设 DOCKER_SOCKET_PATH=/run/podman/podman.sock（见 manual-deploy.md）。
      # 安全权衡见 ADR-0006。
      - ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--method=GET", "-O-", "http://localhost:9090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - proxy

  # 前端生产服务（2.0 SSR：Node 运行 TanStack Start Nitro server）
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_SITE_URL: ${VITE_SITE_URL:-https://xunrua.top}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
    image: localhost/violet-web:latest
    container_name: blog-web
    restart: always
    expose:
      - "3000"
    environment:
      # nginx-proxy 虚拟主机配置
      VIRTUAL_HOST: ${VIRTUAL_HOST:-xunrua.top}
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-xunrua.top}
      LETSENCRYPT_EMAIL: defect.y@qq.com
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - proxy

volumes:
  postgres_data:
    name: blog_postgres_data
  redis_data:
    name: blog_redis_data
  uploads_data:
    name: blog_uploads_data

networks:
  backend:
    name: violet_network
  proxy:
    name: nginx-proxy
    external: true