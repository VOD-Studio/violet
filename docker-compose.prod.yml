# 生产环境配置
# 使用: docker compose --env-file api/.env -f docker-compose.prod.yml up -d
#
# 前置条件:
# 1. 复制 api/.env.example 到 api/.env 并修改配置（特别是 POSTGRES_PASSWORD 和 SUPERADMIN_PASSWORD）
# 2. 上传文件由命名卷 uploads_data 持久化，无需手动创建宿主机目录

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: always
    # 端口不对外暴露，仅内部网络访问
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-blog}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    # 端口不对外暴露，仅内部网络访问
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend

  # Go API 服务
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: blog-api
    restart: always
    # API Dockerfile 创建 UID/GID 65532 的非 root 用户，
    # 密钥由 scripts/init-production.sh 设为 65532:65532 或 chmod 644 可读
    # 端口不对外暴露，通过 nginx-proxy 反向代理 /api/v1/
    expose:
      - "8080"
    env_file:
      - ./api/.env
    environment:
      # 覆盖数据库连接为内部 Docker 网络地址（API 代码读取 DATABASE_* 变量）
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-blog}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSLMODE: disable
      # 覆盖 Redis 连接为内部 Docker 网络地址
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
      # JWT 密钥路径
      JWT_PRIVATE_KEY_PATH: /secrets/jwt_private_key.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt_public_key.pem
    volumes:
      # 持久化上传文件
      - uploads_data:/app/uploads
      # JWT 密钥（只读挂载）
      - ./secrets/jwt_private_key.pem:/secrets/jwt_private_key.pem:ro
      - ./secrets/jwt_public_key.pem:/secrets/jwt_public_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--method=GET", "-O-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - proxy

  # 前端生产服务（2.0 SSR：Node 运行 TanStack Start Nitro server）
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://xunrua.top/api/v1}
    container_name: blog-web
    restart: always
    # 宿主机 80 映射到容器内 Nitro server 的 3000
    ports:
      - "80:3000"
    environment:
      # nginx-proxy 虚拟主机配置
      VIRTUAL_HOST: ${VIRTUAL_HOST:-xunrua.top}
      LETSENCRYPT_HOST: ${LETSENCRYPT_HOST:-xunrua.top}
      LETSENCRYPT_EMAIL: defect.y@qq.com
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend
      - proxy

volumes:
  postgres_data:
    name: blog_postgres_data
  redis_data:
    name: blog_redis_data
  uploads_data:
    name: blog_uploads_data

networks:
  backend:
    name: blog_network
  proxy:
    name: nginx-proxy
    external: true