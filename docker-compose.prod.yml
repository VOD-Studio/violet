# 生产环境配置
# 使用: docker compose --env-file api/.env -f docker-compose.prod.yml up -d
#
# 前置条件:
# 1. 复制 api/.env.example 到 api/.env 并修改配置（特别是 POSTGRES_PASSWORD 和 SUPERADMIN_PASSWORD）
# 2. 上传文件由命名卷 uploads_data 持久化，无需手动创建宿主机目录

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: blog-postgres
    restart: always
    # 端口不对外暴露，仅内部网络访问
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required in production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required in production}
      POSTGRES_DB: ${POSTGRES_DB:-blog}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-blog}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    # 端口不对外暴露，仅内部网络访问
    expose:
      - "6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - backend

  # Go API 服务
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: blog-api
    restart: always
    # distroless 镜像默认 nonroot 用户无法读取宿主编码挂载的 JWT 密钥，
    # 暂以 root 运行以保证密钥可读；后续可改为初始化时 chown 65532:65532
    user: "0:0"
    # 端口不对外暴露，通过 web 容器反向代理
    expose:
      - "8080"
    env_file:
      - ./api/.env
    environment:
      # 覆盖数据库连接为内部 Docker 网络地址（API 代码读取 DATABASE_* 变量）
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-blog}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_SSLMODE: disable
      # 覆盖 Redis 连接为内部 Docker 网络地址
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_PASSWORD: ""
      # JWT 密钥路径
      JWT_PRIVATE_KEY_PATH: /secrets/jwt_private_key.pem
      JWT_PUBLIC_KEY_PATH: /secrets/jwt_public_key.pem
    volumes:
      # 持久化上传文件
      - uploads_data:/app/uploads
      # JWT 密钥（只读挂载）
      - ./secrets/jwt_private_key.pem:/secrets/jwt_private_key.pem:ro
      - ./secrets/jwt_public_key.pem:/secrets/jwt_public_key.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

  # 前端生产服务（Nginx 托管静态资源 + 反向代理 API）
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: blog-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - backend

volumes:
  postgres_data:
    name: blog_postgres_data
  redis_data:
    name: blog_redis_data
  uploads_data:
    name: blog_uploads_data

networks:
  backend:
    name: blog_network