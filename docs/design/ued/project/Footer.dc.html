<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Violet 页脚</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Maple Mono";font-weight:400;font-style:normal;src:url(/_blob/a3ecea3add4961def4d089b95f486230) format("woff2")}
@font-face{font-family:"Maple Mono";font-weight:500;font-style:normal;src:url(/_blob/1ba23035f8e49762aeac0a2a66f83fa0) format("woff2")}
@font-face{font-family:"Maple Mono";font-weight:700;font-style:normal;src:url(/_blob/bf99f5c378937eca7117785bf1df1b55) format("woff2")}
body{margin:0}
.vf-ft a{color:inherit;text-decoration:none}
.vf-ft a:hover{color:var(--fg)}
.vf-ft h3{margin:0;font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--fg)}
.vf-ft ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;font-size:12px;color:color-mix(in oklab,var(--fg) 75%,transparent)}
.vf-fall{position:absolute;width:16px;height:16px}
</style>
</helmet>
<footer class="vf-ft" style="{{vars}}position:relative;width:100%;padding-top:64px;font-family:'Songti SC','Noto Serif SC','Source Han Serif SC',STSong,SimSun,serif;color:var(--fg);line-height:1.6">
  <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:64px;background:linear-gradient(to bottom,transparent,var(--tint))"></div>
  <div style="position:relative;background:var(--tint);padding:32px 0 16px">

    <sc-if value="{{spring}}" hint-placeholder-val="{{ true }}">
      <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:0">
        <sc-for list="{{fallen}}" as="f" hint-placeholder-count="9">
          <svg class="vf-fall" viewBox="0 0 16 16" style="{{f.pos}}"><ellipse cx="8" cy="8" rx="{{f.rx}}" ry="{{f.ry}}" fill="{{f.fill}}" stroke="{{stroke}}" stroke-width=".6"></ellipse></svg>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{autumn}}" hint-placeholder-val="{{ false }}">
      <div aria-hidden="true" style="position:absolute;left:0;right:0;top:0;height:0">
        <sc-for list="{{fallen}}" as="f" hint-placeholder-count="9">
          <svg class="vf-fall" viewBox="-12 -12 24 24" style="{{f.pos}}"><path d="M0,-10 L1.8,-5.2 L6.2,-7.2 L4.2,-2.4 L9.5,-0.5 L4,1.8 L5.2,6.2 L0.8,3.6 L0,9 L-0.8,3.6 L-5.2,6.2 L-4,1.8 L-9.5,-0.5 L-4.2,-2.4 L-6.2,-7.2 L-1.8,-5.2 Z" fill="{{leaf}}" stroke="{{stroke}}" stroke-width=".6"></path><path d="M0,9 L0,-7 M0,0 L5,-4.5 M0,0 L-5,-4.5" fill="none" stroke="{{vein}}" stroke-width=".7"></path></svg>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{winter}}" hint-placeholder-val="{{ false }}">
      <svg aria-hidden="true" viewBox="0 0 1200 24" preserveAspectRatio="none" style="position:absolute;left:0;right:0;top:-16px;width:100%;height:24px"><path d="M0,24 L0,14 C60,6 120,10 190,8 C270,5 330,12 410,9 C500,5 560,11 650,8 C740,4 800,12 880,9 C960,6 1030,11 1100,8 C1150,6 1180,9 1200,10 L1200,24 Z" fill="{{snow}}" stroke="{{snowLine}}" stroke-width=".8" vector-effect="non-scaling-stroke"></path></svg>
    </sc-if>

    <div style="position:relative;max-width:1120px;margin:0 auto">
      <div style="display:flex;justify-content:space-between;gap:64px">
        <div style="max-width:384px;display:flex;flex-direction:column;gap:12px">
          <a href="#" style="font-family:'Maple Mono',ui-monospace,monospace;font-size:24px;font-weight:700;letter-spacing:.025em;line-height:1.3">Violet</a>
          <p style="margin:0;font:italic 400 12px/1.7 Georgia,'Noto Serif SC',serif;color:color-mix(in oklab,var(--fg) 85%,transparent)">一花一叶，皆成文章。</p>
          <p style="margin:0;font-family:'Maple Mono',ui-monospace,monospace;font-size:12px;color:var(--muted)">© 2026 Powered by Violet.</p>
          <div role="status" style="display:flex;align-items:center;gap:8px;padding-top:4px;font-size:11px;color:var(--muted)"><span aria-hidden="true" style="width:6px;height:6px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px color-mix(in oklab,var(--ok) 22%,transparent)"></span>站点安静运行中</div>
        </div>
        <nav aria-label="页脚导航" style="display:grid;grid-template-columns:repeat(3,max-content);gap:64px">
          <div><h3>关于</h3><ul><li><a href="#">关于本站</a></li><li><a href="#">友链来往</a></li><li><a href="#">开源项目</a></li></ul></div>
          <div><h3>著述</h3><ul><li><a href="#">文心长墨</a></li><li><a href="#">求索札记</a></li><li><a href="#">长卷连载</a></li><li><a href="#">光影撷影</a></li></ul></div>
          <div><h3>连接</h3><ul><li><a href="#">推文微动态</a></li><li><a href="#">RSS 订阅</a></li><li><a href="#" style="display:inline-flex;align-items:center;gap:2px">GitHub<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="opacity:.6"><path d="M7 17 17 7M8 7h9v9"></path></svg></a></li></ul></div>
        </nav>
      </div>
      <div style="display:flex;align-items:center;gap:12px;margin-top:16px;font-size:12px;color:var(--muted)">
        <span style="font-family:'Maple Mono',ui-monospace,monospace">xunrua.top</span>
        <span style="margin-left:auto;font-family:'Maple Mono',ui-monospace,monospace">© 2026 Violet. All rights reserved.</span>
      </div>
    </div>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"season":{"editor":"enum","options":["春","夏","秋","冬"],"default":"春"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":320}}'>
class Component extends DCLogic {
  renderVals() {
    const S = { '春': ['#f47983', 16.6], '夏': ['#2f9e7a', 162], '秋': ['#d9a21b', 82.95], '冬': ['#7d8ea3', 252] };
    const season = S[this.props.season] ? this.props.season : '春';
    const [seed, h] = S[season];
    const dark = !!this.props.dark;
    const bg = dark ? `oklch(0.17 0.0087 ${h})` : `oklch(0.968 0.006 ${h})`;
    const vars = (dark
      ? `--fg:oklch(0.9373 0.015 ${h});--muted:oklch(0.8573 0.0225 ${h});--ok:oklch(0.74 0.15 155);`
      : `--fg:oklch(0.3331 0.0175 ${h});--muted:oklch(0.4717 0.0225 ${h});--ok:oklch(0.52 0.13 155);`)
      + `--tint:color-mix(in oklab,${seed} 7%,${bg});`;
    const mix = (p) => `color-mix(in oklab,${seed} ${p}%,${bg})`;
    const FALLEN = [[4, -6, -20], [11, 2, 40], [19, -4, 110], [33, 0, -60], [46, -7, 15], [61, 1, 80], [70, -5, -35], [83, -1, 140], [94, -6, 60]];
    const fallen = FALLEN.map(([x, y, r]) => ({
      pos: `left:${x}%;top:${y}px;transform:rotate(${r}deg);`,
      rx: x % 2 === 0 ? 3 : 4.2, ry: x % 2 === 0 ? 4 : 5.6,
      fill: x % 2 === 0 ? mix(30) : mix(42),
    }));
    return {
      vars, fallen,
      spring: season === '春', autumn: season === '秋', winter: season === '冬',
      stroke: mix(season === '秋' ? 100 : 62),
      leaf: mix(88), vein: `color-mix(in oklab,${seed} 70%,${dark ? '#fff' : '#000'})`,
      snow: dark ? `oklch(0.3 0.01 ${h})` : '#fbfcfd', snowLine: dark ? 'rgb(255 255 255 / .14)' : 'rgb(0 0 0 / .1)',
    };
  }
}
</script>
</body>
</html>
