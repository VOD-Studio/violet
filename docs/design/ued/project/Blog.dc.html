<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Violet 博客列表</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Maple Mono";font-weight:400;font-style:normal;src:url(/_blob/a3ecea3add4961def4d089b95f486230) format("woff2")}
@font-face{font-family:"Maple Mono";font-weight:500;font-style:normal;src:url(/_blob/1ba23035f8e49762aeac0a2a66f83fa0) format("woff2")}
@font-face{font-family:"Maple Mono";font-weight:700;font-style:normal;src:url(/_blob/bf99f5c378937eca7117785bf1df1b55) format("woff2")}
body{margin:0}
a{color:inherit;text-decoration:none}
.paper-l{position:absolute;inset:0;background-image:url(/_blob/66391f4a5c5b623abcbda5bc91818ab0);background-size:1440px 1600px;background-repeat:repeat-y;pointer-events:none}
.paper-d{position:absolute;inset:0;background-image:url(/_blob/b0a1c287fd95586fcb700c431de8f4c5);background-size:1440px 1600px;background-repeat:repeat-y;pointer-events:none}
.serif{font-family:Georgia,"Noto Serif SC","Songti SC",serif}
.seg{display:inline-flex;padding:2px;border-radius:999px;background:var(--sunk)}
.sg{display:inline-flex;align-items:center;gap:6px;box-sizing:border-box;height:32px;padding:0 12px;border-radius:999px;font-size:14px;color:var(--muted)}
.sg i{font-style:normal;font-size:12px;opacity:.7}
.sg.on{background:var(--sheet);color:var(--fg);font-weight:500;box-shadow:0 4px 24px rgb(0 0 0 / .05)}
/* 精选：沿用原设计——整幅大图、底部渐暗、叠字 */
.feat{position:relative;display:block;height:440px;border-radius:16px;overflow:hidden;background:#2a1d18}
.feat img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 28%}
.feat .sh{position:absolute;inset:0;background:linear-gradient(to top,rgb(18 12 8 / .82) 0%,rgb(18 12 8 / .45) 38%,transparent 66%)}
.feat .tx{position:absolute;left:44px;right:44px;bottom:38px;color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 11px;border-radius:999px;background:rgb(255 255 255 / .16);backdrop-filter:blur(8px);font-size:12px;font-weight:500}
/* 相框卡（B）：瀑布流；有封面才有画面，没有就是纯文字卡 */
.wf{columns:3;column-gap:24px;margin-top:28px}
.mat{display:block;break-inside:avoid;margin-bottom:24px;box-sizing:border-box;padding:10px 10px 18px;background:var(--sheet);border-radius:4px;box-shadow:0 4px 24px rgb(0 0 0 / .05);border:1px solid var(--ol)}
.mat.txt{padding:22px 22px 20px}
.mat img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.cap{padding:14px 6px 0}
.mat.txt .cap{padding:0}
.meta{display:flex;gap:8px;font:400 12px "Maple Mono",monospace;color:var(--muted)}
.meta .tg{color:var(--fg)}
.ttl{margin-top:8px;font-weight:500;line-height:1.5;letter-spacing:-0.01em}
.ex{margin-top:8px;font-size:13.5px;line-height:1.8;color:var(--muted)}
.pg{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 8px;border-radius:999px;font-size:13px;color:var(--muted)}
.pg.on{background:var(--fg);color:var(--bg)}
</style>
</helmet>
<div style="{{vars}}position:relative;overflow:hidden;width:1440px;min-height:2300px;display:flex;flex-direction:column;background:var(--bg);color:var(--fg);font-family:'Songti SC','Noto Serif SC','Source Han Serif SC',STSong,SimSun,serif;font-size:14px;line-height:1.6">

<div class="paper-l" style="display:{{showLight}}"></div>
<div class="paper-d" style="display:{{showDark}}"></div>
<img src="{{art}}" alt="" style="position:absolute;top:0;right:0;width:520px;opacity:.7;pointer-events:none;mix-blend-mode:{{blend}};-webkit-mask-image:radial-gradient(circle at 100% 0%,#000 58%,transparent 96%);mask-image:radial-gradient(circle at 100% 0%,#000 58%,transparent 96%)">

<div style="position:absolute;z-index:20;top:0;left:0;right:0">
  <dc-import name="Header" state="rest" section="博客" presence="music" bare="{{ true }}" season="{{season}}" dark="{{dark}}" hint-size="1440px,70px"></dc-import>
</div>

<main style="position:relative;z-index:2;width:1120px;margin:0 auto;padding:120px 0 0">

<div style="display:flex;align-items:flex-end;justify-content:space-between">
  <h1 style="margin:0;font-size:52px;font-weight:400;line-height:1.1;letter-spacing:-0.03em">博客</h1>
  <div style="display:flex;align-items:center;gap:10px"><span class="seg"><span class="sg on">全部<i>270</i></span><span class="sg">系列</span><span class="sg">归档</span></span>
    <button style="display:flex;align-items:center;gap:6px;height:36px;padding:0 16px;border:0;border-radius:999px;background:var(--sunk);font:inherit;font-size:14px;font-weight:500;color:var(--fg);cursor:pointer">全部标签<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
</div>

<a href="#" class="feat" style="margin-top:32px"><img src="/_blob/b3590420a4e33d58179b86763514d61e" alt=""><span class="sh"></span>
  <span class="tx"><span class="pill"><svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="m12 2 3 6.6 7 .8-5.2 4.8 1.5 7L12 17.6 5.7 21.2l1.5-7L2 9.4l7-.8z"/></svg>精选</span>
    <span style="display:block;margin-top:14px;max-width:780px;font-size:32px;font-weight:700;line-height:1.35;letter-spacing:-0.02em">派早报：荣耀发布 Robot Phone、Google 推出 Pixel 11 系列等</span>
    <span style="display:block;margin-top:10px;max-width:680px;font-size:15px;line-height:1.7;opacity:.82">影石发布 Insta360 X6、SpaceXAI 推出 Grok Bot 等。</span>
    <span style="display:block;margin-top:14px;font-size:12.5px;opacity:.65">super · 2026.08.15 · 200 次阅读</span></span>
</a>

<div class="wf">
  <sc-for list="{{posts}}" as="p" hint-placeholder-count="9">
    <a href="#" class="mat {{p.cls}}">
      <sc-if value="{{p.img}}" hint-placeholder-val="{{ false }}"><img src="{{p.img}}" alt=""></sc-if>
      <div class="cap"><div class="meta"><span class="tg">{{p.tag}}</span><span>{{p.date}}</span><span>{{p.mins}}</span></div>
        <div class="ttl" style="font-size:{{p.fs}}px">{{p.title}}</div>
        <div class="ex serif">{{p.excerpt}}</div></div>
    </a>
  </sc-for>
</div>


</main>

<div style="position:relative;z-index:2;margin-top:auto;padding-top:96px">
  <dc-import name="Footer" season="{{season}}" dark="{{dark}}" hint-size="1440px,320px"></dc-import>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"season":{"editor":"enum","options":["春","夏","秋","冬"],"default":"春"},"dark":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":2300}}'>
class Component extends DCLogic {
  renderVals() {
    const S = {
      '春': { seed: '#f47983', h: 16.6, l: '/_blob/d8aaad66118cac26d5af34610af527bf', d: '/_blob/0cfa75d49c85d4df8e63d591ce6c7ea1' },
      '夏': { seed: '#2f9e7a', h: 162, l: '/_blob/c0353bf8edad55e8130fb95826b3799f', d: '/_blob/8ab23c87229ff622bac13566cfb665fd' },
      '秋': { seed: '#d9a21b', h: 82.95, l: '/_blob/d837ab2ada8c6a3cbb1a71fea71be6e2', d: '/_blob/8a07e26da1a24b8a9f19bf09a30aca11' },
      '冬': { seed: '#7d8ea3', h: 252, l: '/_blob/eb4210561b3c04659b349b6813d7ba9c', d: '/_blob/f4961af0e552cbba606908f217a44b37' },
    };
    const season = S[this.props.season] ? this.props.season : '春';
    const dark = !!this.props.dark;
    const s = S[season], h = s.h;
    const vars = dark
      ? `--bg:oklch(0.17 0.0087 ${h});--sheet:oklch(0.235 0.011 ${h});--sunk:oklch(0.29 0.012 ${h});--fg:oklch(0.9373 0.015 ${h});--muted:oklch(0.8573 0.0225 ${h});--rule:oklch(0.9373 0.015 ${h} / .12);--deco:${s.seed};--ol:rgb(255 255 255 / .08);`
      : `--bg:oklch(0.968 0.006 ${h});--sheet:oklch(0.994 0.003 ${h});--sunk:oklch(0.945 0.007 ${h});--fg:oklch(0.3331 0.0175 ${h});--muted:oklch(0.4717 0.0225 ${h});--rule:oklch(0.3331 0.0175 ${h} / .11);--deco:${s.seed};--ol:transparent;`;
    const P = (tag, date, mins, title, excerpt, img) => ({ tag, date, mins, title, excerpt, img: img || '', cls: img ? '' : 'txt', fs: img ? 17 : 19 });
    const posts = [
      P('Go', '2026.08.16', '21 分钟', '拆解 Saber —— 一个用 Go 写就的、会思考的聊天机器人', '把 LLM 塞进聊天室只需二十行胶水代码；但要让它在真实世界里稳定、安全、有个性地活下去，需要的是一整个工程。'),
      P('少数派', '2026.08.16', '', '浏览器扩展合集：我们为你找到了这 6 款实用、有趣的「新玩意」', '在浏览器扩展这边，近期又有哪些好用、有趣的「新玩意」呢？', '/_blob/1012544f4ed7f26a3a5cf8e7168ba2fb'),
      P('Rust', '2026.08.16', '18 分钟', '逐像素弯曲时空：singularity-rs 黑洞渲染器深度解析', '一个用 Bevy 0.19 写就的实时 Kerr（旋转）黑洞渲染器，如何把广义相对论写进着色器。'),
      P('少数派', '2026.08.16', '', '不改签名，把 Mac 微信聊天记录搬到外置硬盘：APFS 宗卷挂载实践', '对长期把 Mac 放在固定位置、外置硬盘常年连接的用户来说，它可以让体积庞大的聊天记录不再挤占有限的内置存储。', '/_blob/308797aa41aa7e3c8a616ad023ec3225'),
      P('Rust', '2026.08.16', '14 分钟', 'Yggdrasil：用 Rust 同时编译浏览器与服务器', '理解了编译架构，来看运行时。main.rs 是整个服务端的启动入口，也是同构代码的分叉点。'),
      P('少数派', '2026.08.16', '', 'TDS REVIEW | 铁三角 ATH-SQ1TW2NC 降噪真无线耳机体验', 'SQ1TW2NC 的声音素质、编码配置和降噪综合能力。', '/_blob/c0b2c1dc5dad99971e0a4a57c795f88f'),
      P('CI/CD', '2026.08.16', '16 分钟', '全栈 Rust 系统的 CI/CD 架构白皮书', '全栈 Rust 应用（结合 WebAssembly）的高性能构建、缓存与发布流水线。'),
      P('骑行', '2026.08.15', '11 分钟', '我平时骑车不到 20km/h，却用 6 天骑完了独库公路', '如果你也想骑一次独库，希望这份来自普通骑行爱好者的实战记录，能让你少走一些弯路。'),
      P('写作', '2026.08.05', '12 分钟', '文章编辑器全功能特性手册', '面向作者的完整功能参考。编辑器为 Tiptap 富文本，保存时双写 HTML 与 Markdown。'),
    ];
    return {
      vars, season, dark, posts,
      art: dark ? s.d : s.l,
      blend: dark ? 'normal' : 'multiply',
      showLight: dark ? 'none' : 'block', showDark: dark ? 'block' : 'none',
    };
  }
}
</script>
</body>
</html>
