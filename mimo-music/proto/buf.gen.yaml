version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/VOD-Studio/mimo-music/gen/go
  # googleapis 的 go_package 不被 prefix 覆盖，指向 genproto 标准包。
  disable:
    - file_option: go_package
      module: buf.build/googleapis/googleapis
plugins:
  # Go message + gRPC service stub
  - remote: buf.build/protocolbuffers/go
    out: ../gen/go
    opt:
      - paths=source_relative
  - remote: buf.build/grpc/go
    out: ../gen/go
    opt:
      - paths=source_relative
      - require_unimplemented_servers=false
  # grpc-gateway: 从 google.api.http annotation 生成 REST reverse proxy
  - remote: buf.build/grpc-ecosystem/gateway
    out: ../gen/go
    opt:
      - paths=source_relative
  # OpenAPI v2: 从 proto + annotation 生成 OpenAPI spec
  - remote: buf.build/grpc-ecosystem/openapiv2
    out: ../gen/openapi
    opt:
      - logtostderr=true
      - allow_merge=true
      - merge_file_name=mimo-music
