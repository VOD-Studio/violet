syntax = "proto3";

package netease.music.v1;

import "google/api/annotations.proto";
import "netease/music/v1/song.proto";
import "netease/music/v1/search.proto";

option go_package = "github.com/VOD-Studio/mimo-music/gen/go/netease/music/v1;mmpb";

// PlaylistService 提供歌单查询与浏览能力。
service PlaylistService {
  // GetPlaylist 获取歌单详情（含歌曲列表）。
  rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/{playlist_id}"
    };
  }

  // HighQuality 获取精品歌单列表。
  rpc HighQuality(HighQualityRequest) returns (HighQualityResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/highquality"
    };
  }

  // HighQualityTags 获取精品歌单标签列表。
  rpc HighQualityTags(HighQualityTagsRequest) returns (HighQualityTagsResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/highquality/tags"
    };
  }

  // CatList 获取歌单分类列表。
  rpc CatList(CatListRequest) returns (CatListResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/categories"
    };
  }

  // BrowseHot 获取网友精选碟（热门歌单）。
  rpc BrowseHot(BrowseHotRequest) returns (BrowseHotResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/hot"
    };
  }

  // Subscribers 获取歌单收藏者列表。
  rpc Subscribers(SubscribersRequest) returns (SubscribersResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/{playlist_id}/subscribers"
    };
  }

  // AllTracks 获取歌单全量歌曲（分页）。
  rpc AllTracks(AllTracksRequest) returns (AllTracksResponse) {
    option (google.api.http) = {
      get: "/api/v1/playlists/{playlist_id}/tracks"
    };
  }

  // Subscribe 收藏/取消收藏歌单（toggle）。
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse) {
    option (google.api.http) = {
      post: "/api/v1/playlists/{playlist_id}/subscribe"
      body: "*"
    };
  }

  // Create 新建歌单。
  rpc Create(CreateRequest) returns (CreateResponse) {
    option (google.api.http) = {
      post: "/api/v1/playlists"
      body: "*"
    };
  }

  // Delete 删除歌单。
  rpc Delete(DeleteRequest) returns (DeleteResponse) {
    option (google.api.http) = {
      delete: "/api/v1/playlists/{playlist_id}"
    };
  }

  // UpdateName 更新歌单名。
  rpc UpdateName(UpdateNameRequest) returns (UpdateNameResponse) {
    option (google.api.http) = {
      patch: "/api/v1/playlists/{playlist_id}/name"
      body: "*"
    };
  }

  // UpdateDesc 更新歌单描述。
  rpc UpdateDesc(UpdateDescRequest) returns (UpdateDescResponse) {
    option (google.api.http) = {
      patch: "/api/v1/playlists/{playlist_id}/desc"
      body: "*"
    };
  }

  // UpdateTags 更新歌单标签。
  rpc UpdateTags(UpdateTagsRequest) returns (UpdateTagsResponse) {
    option (google.api.http) = {
      patch: "/api/v1/playlists/{playlist_id}/tags"
      body: "*"
    };
  }

  // UpdateTracks 添加或删除歌曲（op=add/del）。
  rpc UpdateTracks(UpdateTracksRequest) returns (UpdateTracksResponse) {
    option (google.api.http) = {
      post: "/api/v1/playlists/{playlist_id}/tracks"
      body: "*"
    };
  }
}

// Playlist 是歌单实体。
message Playlist {
  // 歌单 ID。
  int64 id = 1;
  // 歌单名。
  string name = 2;
  // 歌单封面 URL。
  string cover_url = 3;
  // 歌曲总数。
  int32 track_count = 4;
  // 创建者信息。
  User creator = 5;
  // 歌单内歌曲列表。
  repeated Song songs = 6;
}

// User 是用户实体（简要）。被歌单创建者、用户模块等复用。
message User {
  // 用户 ID。
  int64 id = 1;
  // 昵称。
  string nickname = 2;
  // 头像 URL。
  string avatar_url = 3;
}

// GetPlaylist 请求。
message GetPlaylistRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
}

// GetPlaylist 响应。
message GetPlaylistResponse {
  // 歌单详情。
  Playlist playlist = 1;
}

// --- 歌单浏览与发现 message ---

// HighQuality 请求。
message HighQualityRequest {
  // 分类标签（空=全部）。
  string cat = 1;
  // 每页数量。
  int32 limit = 2;
  // 偏移量。
  int32 offset = 3;
}

// HighQuality 响应。
message HighQualityResponse {
  // 精品歌单列表。
  repeated SearchPlaylist playlists = 1;
  // 总数。
  int32 total = 2;
}

// HighQualityTags 请求（无参数）。
message HighQualityTagsRequest {}

// 精品歌单标签。
message HighQualityTag {
  // 标签名。
  string name = 1;
  // 分类。
  string category = 2;
}

// HighQualityTags 响应。
message HighQualityTagsResponse {
  // 标签列表。
  repeated HighQualityTag tags = 1;
}

// CatList 请求（无参数）。
message CatListRequest {}

// 歌单分类子项。
message PlaylistCategory {
  // 分类名。
  string name = 1;
  // 资源数。
  int64 resource_count = 2;
  // 类型 ID。
  int64 type_id = 3;
}

// CatList 响应。
message CatListResponse {
  // 分类列表。
  repeated PlaylistCategory categories = 1;
}

// BrowseHot 请求（网友精选碟/热门歌单）。
message BrowseHotRequest {
  // 分类标签。
  string cat = 1;
  // 排序方式（new/hot）。
  string order = 2;
  // 每页数量。
  int32 limit = 3;
  // 偏移量。
  int32 offset = 4;
}

// BrowseHot 响应。
message BrowseHotResponse {
  // 热门歌单列表。
  repeated SearchPlaylist playlists = 1;
  // 总数。
  int32 total = 2;
}

// Subscribers 请求。
message SubscribersRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 每页数量。
  int32 limit = 2;
  // 偏移量。
  int32 offset = 3;
}

// Subscribers 响应。
message SubscribersResponse {
  // 收藏者列表。
  repeated User subscribers = 1;
  // 总数。
  int32 total = 2;
}

// AllTracks 请求。
message AllTracksRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 每页数量。
  int32 limit = 2;
  // 偏移量。
  int32 offset = 3;
}

// AllTracks 响应。
message AllTracksResponse {
  // 全量歌曲列表（分页）。
  repeated Song songs = 1;
  // 总数。
  int32 total = 2;
}

// --- 歌单写操作 message ---

// Subscribe 请求。
message SubscribeRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 登录态 Cookie。
  string cookie = 2;
}

// Subscribe 响应。
message SubscribeResponse {
  // 操作后是否已收藏。
  bool subscribed = 1;
}

// Create 请求。
message CreateRequest {
  // 歌单名。
  string name = 1;
  // 是否隐私（默认 false）。
  bool privacy = 2;
  // 登录态 Cookie。
  string cookie = 3;
}

// Create 响应。
message CreateResponse {
  // 新建歌单 ID。
  int64 playlist_id = 1;
}

// Delete 请求。
message DeleteRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 登录态 Cookie。
  string cookie = 2;
}

// Delete 响应（无数据，成功即可）。
message DeleteResponse {}

// UpdateName 请求。
message UpdateNameRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 新名称。
  string name = 2;
  // 登录态 Cookie。
  string cookie = 3;
}

// UpdateName 响应。
message UpdateNameResponse {}

// UpdateDesc 请求。
message UpdateDescRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 新描述。
  string desc = 2;
  // 登录态 Cookie。
  string cookie = 3;
}

// UpdateDesc 响应。
message UpdateDescResponse {}

// UpdateTags 请求。
message UpdateTagsRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 标签列表（分号分隔）。
  string tags = 2;
  // 登录态 Cookie。
  string cookie = 3;
}

// UpdateTags 响应。
message UpdateTagsResponse {}

// 歌曲操作类型。
enum TracksOp {
  // 未指定。
  TRACKS_OP_UNSPECIFIED = 0;
  // 添加歌曲。
  TRACKS_OP_ADD = 1;
  // 删除歌曲。
  TRACKS_OP_DEL = 2;
}

// UpdateTracks 请求。
message UpdateTracksRequest {
  // 歌单 ID。
  int64 playlist_id = 1;
  // 操作类型。
  TracksOp op = 2;
  // 歌曲 ID 列表。
  repeated int64 track_ids = 3;
  // 登录态 Cookie。
  string cookie = 4;
}

// UpdateTracks 响应。
message UpdateTracksResponse {
  // 成功添加的歌曲 ID。
  repeated int64 body_track_ids = 1;
}
