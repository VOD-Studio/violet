syntax = "proto3";

package netease.music.v1;

import "google/api/annotations.proto";
import "netease/music/v1/song.proto";

option go_package = "github.com/VOD-Studio/mimo-music/gen/go/netease/music/v1;mmpb";

// SearchService 提供搜索能力。支持多类型搜索 + 搜索辅助（建议/热搜/默认词）。
service SearchService {
  // Search 按关键词搜索，type 控制搜索类型。
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/api/v1/search"
    };
  }

  // Suggest 获取搜索建议（输入补全）。
  rpc Suggest(SuggestRequest) returns (SuggestResponse) {
    option (google.api.http) = {
      get: "/api/v1/search/suggest"
    };
  }

  // Hot 获取热搜词列表（简略）。
  rpc Hot(HotRequest) returns (HotResponse) {
    option (google.api.http) = {
      get: "/api/v1/search/hot"
    };
  }

  // HotDetail 获取热搜词列表（详细，含封面/排名）。
  rpc HotDetail(HotDetailRequest) returns (HotDetailResponse) {
    option (google.api.http) = {
      get: "/api/v1/search/hot/detail"
    };
  }

  // DefaultKeyword 获取默认搜索关键词。
  rpc DefaultKeyword(DefaultKeywordRequest) returns (DefaultKeywordResponse) {
    option (google.api.http) = {
      get: "/api/v1/search/default"
    };
  }
}

// 搜索类型。地基阶段只用 SONG，Phase 4 扩展全部。
enum SearchType {
  // 未指定，默认单曲。
  SEARCH_TYPE_UNSPECIFIED = 0;
  // 单曲。
  SEARCH_TYPE_SONG = 1;
  // 专辑。
  SEARCH_TYPE_ALBUM = 10;
  // 歌手。
  SEARCH_TYPE_ARTIST = 100;
  // 歌单。
  SEARCH_TYPE_PLAYLIST = 1000;
  // 用户。
  SEARCH_TYPE_USER = 1002;
  // MV。
  SEARCH_TYPE_MV = 1004;
  // 歌词。
  SEARCH_TYPE_LYRIC = 1006;
  // 主播电台。
  SEARCH_TYPE_DJ = 1009;
  // 视频。
  SEARCH_TYPE_VIDEO = 1014;
  // 综合。
  SEARCH_TYPE_ALL = 1018;
}

// Search 请求。
message SearchRequest {
  // 搜索关键词。
  string keyword = 1;
  // 搜索类型，地基阶段固定 SONG。
  SearchType type = 2;
  // 每页数量。
  int32 limit = 3;
  // 偏移量。
  int32 offset = 4;
}

// Search 响应。按请求 type 填充对应字段，其余为空。
message SearchResponse {
  // 匹配的单曲列表（type=SONG）。
  repeated Song songs = 1;
  // 结果总数。
  int32 total = 2;
  // 匹配的专辑列表（type=ALBUM）。
  repeated Album albums = 3;
  // 匹配的歌手列表（type=ARTIST）。
  repeated Artist artists = 4;
  // 匹配的歌单列表（type=PLAYLIST）。
  repeated SearchPlaylist playlists = 5;
  // 匹配的用户列表（type=USER）。
  repeated SearchUser users = 6;
  // 匹配的 MV 列表（type=MV）。
  repeated SearchMV mvs = 7;
}

// SearchPlaylist 是搜索结果里的歌单（字段比详情精简）。
message SearchPlaylist {
  // 歌单 ID。
  int64 id = 1;
  // 歌单名。
  string name = 2;
  // 封面 URL。
  string cover_url = 3;
  // 播放数。
  int64 play_count = 4;
  // 曲目数。
  int32 track_count = 5;
  // 创建者昵称。
  string creator = 6;
}

// SearchUser 是搜索结果里的用户。
message SearchUser {
  // 用户 ID。
  int64 id = 1;
  // 昵称。
  string nickname = 2;
  // 头像 URL。
  string avatar_url = 3;
}

// SearchMV 是搜索结果里的 MV（最小字段，歌手扩展 issue 0007 充实完整 MV 实体）。
message SearchMV {
  // MV ID。
  int64 id = 1;
  // MV 名。
  string name = 2;
  // 封面 URL。
  string cover_url = 3;
  // 歌手名。
  string artist = 4;
}

// --- 搜索辅助接口 message ---

// Suggest 请求。
message SuggestRequest {
  // 输入关键词。
  string keyword = 1;
}

// Suggest 响应。
message SuggestResponse {
  // 匹配的单曲建议。
  repeated string songs = 1;
  // 匹配的专辑建议。
  repeated string albums = 2;
  // 匹配的歌手建议。
  repeated string artists = 3;
  // 匹配的歌单建议。
  repeated string playlists = 4;
}

// Hot 请求（无参数）。
message HotRequest {}

// 热搜词条目（简略）。
message HotKeyword {
  // 热搜词。
  string search_word = 1;
  // 排名。
  int32 score = 2;
  // 图标 URL。
  string icon_url = 3;
}

// Hot 响应。
message HotResponse {
  // 热搜词列表。
  repeated HotKeyword keywords = 1;
}

// HotDetail 请求（无参数）。
message HotDetailRequest {}

// 热搜词条目（详细，含封面）。
message HotDetail {
  // 热搜词。
  string search_word = 1;
  // 排名。
  int32 score = 2;
  // 排名位置。
  int32 position = 3;
  // 封面 URL。
  string cover_url = 4;
  // 图标 URL。
  string icon_url = 5;
}

// HotDetail 响应。
message HotDetailResponse {
  // 热搜详细列表。
  repeated HotDetail details = 1;
}

// DefaultKeyword 请求（无参数）。
message DefaultKeywordRequest {}

// DefaultKeyword 响应。
message DefaultKeywordResponse {
  // 默认搜索关键词。
  string keyword = 1;
}
