syntax = "proto3";

package netease.music.v1;

import "google/api/annotations.proto";
import "netease/music/v1/song.proto";

option go_package = "github.com/VOD-Studio/mimo-music/gen/go/netease/music/v1;mmpb";

// SearchService 提供搜索能力。地基阶段只支持单曲搜索（type=1），type 扩展在 Phase 4。
service SearchService {
  // Search 按关键词搜索单曲。
  rpc Search(SearchRequest) returns (SearchResponse) {
    option (google.api.http) = {
      get: "/api/v1/search"
    };
  }
}

// 搜索类型。地基阶段只用 SONG，Phase 4 扩展全部。
enum SearchType {
  // 未指定，默认单曲。
  SEARCH_TYPE_UNSPECIFIED = 0;
  // 单曲。
  SEARCH_TYPE_SONG = 1;
  // 专辑。
  SEARCH_TYPE_ALBUM = 10;
  // 歌手。
  SEARCH_TYPE_ARTIST = 100;
  // 歌单。
  SEARCH_TYPE_PLAYLIST = 1000;
  // 用户。
  SEARCH_TYPE_USER = 1002;
  // MV。
  SEARCH_TYPE_MV = 1004;
  // 歌词。
  SEARCH_TYPE_LYRIC = 1006;
  // 主播电台。
  SEARCH_TYPE_DJ = 1009;
  // 视频。
  SEARCH_TYPE_VIDEO = 1014;
  // 综合。
  SEARCH_TYPE_ALL = 1018;
}

// Search 请求。
message SearchRequest {
  // 搜索关键词。
  string keyword = 1;
  // 搜索类型，地基阶段固定 SONG。
  SearchType type = 2;
  // 每页数量。
  int32 limit = 3;
  // 偏移量。
  int32 offset = 4;
}

// Search 响应。按请求 type 填充对应字段，其余为空。
message SearchResponse {
  // 匹配的单曲列表（type=SONG）。
  repeated Song songs = 1;
  // 结果总数。
  int32 total = 2;
  // 匹配的专辑列表（type=ALBUM）。
  repeated Album albums = 3;
  // 匹配的歌手列表（type=ARTIST）。
  repeated Artist artists = 4;
  // 匹配的歌单列表（type=PLAYLIST）。
  repeated SearchPlaylist playlists = 5;
  // 匹配的用户列表（type=USER）。
  repeated SearchUser users = 6;
  // 匹配的 MV 列表（type=MV）。
  repeated SearchMV mvs = 7;
}

// SearchPlaylist 是搜索结果里的歌单（字段比详情精简）。
message SearchPlaylist {
  // 歌单 ID。
  int64 id = 1;
  // 歌单名。
  string name = 2;
  // 封面 URL。
  string cover_url = 3;
  // 播放数。
  int64 play_count = 4;
  // 曲目数。
  int32 track_count = 5;
  // 创建者昵称。
  string creator = 6;
}

// SearchUser 是搜索结果里的用户。
message SearchUser {
  // 用户 ID。
  int64 id = 1;
  // 昵称。
  string nickname = 2;
  // 头像 URL。
  string avatar_url = 3;
}

// SearchMV 是搜索结果里的 MV（最小字段，歌手扩展 issue 0007 充实完整 MV 实体）。
message SearchMV {
  // MV ID。
  int64 id = 1;
  // MV 名。
  string name = 2;
  // 封面 URL。
  string cover_url = 3;
  // 歌手名。
  string artist = 4;
}
