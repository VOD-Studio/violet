# BACKUP / REFERENCE ONLY
# 此 Nginx 配置不再被当前 docker-compose.prod.yml 使用。
# 旧版编排曾在独立的 nginx 服务中引用本文件；当前生产环境入口点已改为
# web/Dockerfile（多阶段构建）+ web/nginx.conf，由前端容器直接监听 80 端口
# 并反向代理 /api/* 与 /uploads/*。
# 本文件仅作为历史备份与参考保留。

upstream api {
    server api:8080;
}

server {
    listen 80;
    server_name _;

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # API 代理
    location /api/ {
        proxy_pass http://api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://api/uploads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点
    location /health {
        proxy_pass http://api/api/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # 默认拒绝
    location / {
        return 404;
    }
}