[package]
name = "pet-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
schemars = { version = "1", optional = true }
pet-term = { path = "../pet-term" }
sha2 = { workspace = true }
hmac = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "fast"] }

[features]
schema = ["dep:schemars", "pet-term/schema"]

[lints]
workspace = true

[dev-dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "fast"] }
